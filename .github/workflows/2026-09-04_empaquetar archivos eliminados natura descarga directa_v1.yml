name: Empaquetar eliminados Natura
# Versión: 1
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/2026-09-04_empaquetar archivos eliminados natura descarga directa_v1.yml"

permissions:
  contents: read

jobs:
  empaquetar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener respaldo completo
        uses: actions/checkout@v4
        with:
          ref: respaldo-natura-2026-09-04
          fetch-depth: 0

      - name: Obtener main actual
        run: git fetch origin main:refs/remotes/origin/main

      - name: Preparar archivos eliminados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          git diff --diff-filter=D --name-only HEAD origin/main -- natura > eliminados.txt
          while IFS= read -r archivo; do
            [ -n "$archivo" ] || continue
            mkdir -p "staging/$(dirname "$archivo")"
            cp -- "$archivo" "staging/$archivo"
          done < eliminados.txt
          echo "Archivos incluidos:"
          cat eliminados.txt
          echo "Total: $(wc -l < eliminados.txt)"

      - name: Instalar RAR
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rar

      - name: Crear RAR
        shell: bash
        run: |
          set -euo pipefail
          cd staging
          rar a -r "../2026-09-04_archivos eliminados carpeta natura respaldo completo.rar" natura
          cd ..
          rar t "2026-09-04_archivos eliminados carpeta natura respaldo completo.rar"

      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: natura-eliminados-rar
          path: |
            2026-09-04_archivos eliminados carpeta natura respaldo completo.rar
            eliminados.txt
          if-no-files-found: error
          retention-days: 1
