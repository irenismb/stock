name: Actualizar pagina de reparacion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/actualizar-reparacion-temporal.yml

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reemplazar pagina y retirar flujo temporal
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          payload = (
            ''
          )

          contenido = gzip.decompress(base64.b64decode(payload))
          esperado = '4985268ee6817d6207deada2e14bc8cde53311c4b152ef7336938d5c57226256'
          assert hashlib.sha256(contenido).hexdigest() == esperado

          Path('reparación/reparación_de_computadores_santa_marta.html').write_bytes(contenido)
          Path('.github/workflows/actualizar-reparacion-temporal.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mejorar diseño de página de reparación"
          git push
