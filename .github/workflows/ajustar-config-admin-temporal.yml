name: Ajustar configuración web segura

on:
  push:
    paths:
      - '.github/triggers/ajustar-config-admin-temporal.txt'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar almacenamiento técnico seguro
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64
          import re
          import subprocess

          historical = subprocess.check_output(
              ['git','show','6ed97019a27cc6e9aa2f5dce5efcf790969c2b28:natura/catalogo-app.js'],
              text=True,
              encoding='utf-8'
          )
          Path('natura/catalogo-app.js').write_text(historical, encoding='utf-8', newline='\n')

          path = Path('natura/apps-script/administrar precios natura/Código.js')
          text = path.read_text(encoding='utf-8')
          constants = '\n'.join([
              'const CONFIG_SHEET_NAME = "Configuracion";',
              'const CONFIG_KEYS = [',
              '  "REGISTRAR_VISITAS_PROPIAS",',
              '  "MOSTRAR_CANTIDAD_STOCK",',
              '  "MOSTRAR_PRECIOS_PRODUCTO"',
              '];',
          ])
          text, n = re.subn(
              r'const CONFIG_LEGACY_SHEET_NAME = "Configuracion";[\s\S]*?const CONFIG_UPDATED_AT_KEY = "CONFIGURACION_ACTUALIZADA_EN";',
              constants,
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'No se reemplazaron constantes de configuración: {n}')

          encoded = ''
          functions = base64.b64decode(encoded).decode('utf-8')
          text, n = re.subn(
              r'function obtenerConfiguracionWeb\(\) \{[\s\S]*?function normalizarBooleanoConfiguracion_\(valor\) \{[\s\S]*?\n\}',
              lambda _: functions,
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'No se reemplazaron funciones de configuración: {n}')
          path.write_text(text, encoding='utf-8', newline='\n')

          admin = Path('natura/precios-admin.js')
          js = admin.read_text(encoding='utf-8')
          old = 'for(const r of rows||[]){if(r[0]&&r[1]&&["x","si","true","1","oculto"].includes(norm(r[2])))rules.add(key(r[0],r[1]))}'
          new = 'for(const r of rows||[]){if(!r[0]||!r[1])continue;const k=key(r[0],r[1]);["x","si","true","1","oculto"].includes(norm(r[2]))?rules.add(k):rules.delete(k)}'
          if js.count(old) != 1:
              raise SystemExit(f'No se encontró exactamente una carga de reglas legacy: {js.count(old)}')
          admin.write_text(js.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

          git diff --check
          git diff -- natura/catalogo-app.js 'natura/apps-script/administrar precios natura/Código.js' natura/precios-admin.js

      - name: Confirmar cambios en main
        shell: bash
        run: |
          git config user.name 'stock'
          git config user.email '131928432+irenismb@users.noreply.github.com'
          git add natura/catalogo-app.js 'natura/apps-script/administrar precios natura/Código.js' natura/precios-admin.js
          if git diff --cached --quiet; then
            echo '::error::No hubo cambios que confirmar'
            exit 1
          fi
          git commit -m 'Administrar configuración web con backend seguro en Google Sheets'
          git push origin HEAD:main
