name: Ajustar caché de configuración web

on:
  push:
    paths:
      - '.github/triggers/ajustar-config-admin-temporal.txt'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Actualizar caché del catálogo
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('natura/catalogo.html')
          text = path.read_text(encoding='utf-8')
          old = 'catalogo-app.js?actualizacion=integral-2026-09-13-6'
          new = 'catalogo-app.js?actualizacion=integral-2026-09-13-7'
          if text.count(old) != 1:
              raise SystemExit(f'No se encontró exactamente una referencia esperada: {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY
          git diff --check

      - name: Confirmar cambio en main
        shell: bash
        run: |
          git config user.name 'stock'
          git config user.email '131928432+irenismb@users.noreply.github.com'
          git add natura/catalogo.html
          git commit -m 'Actualizar caché tras migrar controles al administrador web'
          git push origin HEAD:main
