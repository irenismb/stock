name: Ajustar configuración web segura

on:
  push:
    paths:
      - '.github/triggers/ajustar-config-admin-temporal.txt'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar almacenamiento técnico seguro
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          # El catálogo público vuelve a leer Configuracion mediante GViz.
          historical = subprocess.check_output(
              ['git','show','6ed97019a27cc6e9aa2f5dce5efcf790969c2b28:natura/catalogo-app.js'],
              text=True,
              encoding='utf-8'
          )
          Path('natura/catalogo-app.js').write_text(historical, encoding='utf-8', newline='\n')

          # El administrador de Google usa Configuracion como backend técnico,
          # resolviendo encabezados y claves en vivo, sin posiciones fijas.
          path = Path('natura/apps-script/administrar precios natura/Código.js')
          text = path.read_text(encoding='utf-8')

          constants = '''const CONFIG_SHEET_NAME = "Configuracion";\nconst CONFIG_KEYS = [\n  "REGISTRAR_VISITAS_PROPIAS",\n  "MOSTRAR_CANTIDAD_STOCK",\n  "MOSTRAR_PRECIOS_PRODUCTO"\n];'''
          text, n = re.subn(
              r'const CONFIG_LEGACY_SHEET_NAME = "Configuracion";[\s\S]*?const CONFIG_UPDATED_AT_KEY = "CONFIGURACION_ACTUALIZADA_EN";',
              constants,
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'No se reemplazaron constantes de configuración: {n}')

          functions = r'''function obtenerConfiguracionWeb() {
  const contexto = obtenerContextoConfiguracion_();
  const valores = leerValoresConfiguracion_(contexto);
  return {
    ok: true,
    valores: valores,
    actualizadoEn: new Date().toISOString()
  };
}

function actualizarConfiguracionWeb(clave, activado) {
  const claveSegura = String(clave == null ? "" : clave).trim().toUpperCase();
  if (CONFIG_KEYS.indexOf(claveSegura) === -1) {
    throw new Error("La clave de configuración no es válida.");
  }

  const estado = normalizarBooleanoConfiguracion_(activado);
  if (estado === null) {
    throw new Error("El estado de configuración no es válido.");
  }

  const bloqueo = LockService.getScriptLock();
  bloqueo.waitLock(30000);
  try {
    const contexto = obtenerContextoConfiguracion_();
    const coincidencias = contexto.filas.filter(function(item) {
      return item.clave === claveSegura;
    });
    if (coincidencias.length !== 1) {
      throw new Error(
        "La clave " + claveSegura + " debe existir exactamente una vez en la pestaña Configuracion."
      );
    }

    const fila = coincidencias[0].fila;
    const estadoTexto = estado ? "ACTIVADO" : "DESACTIVADO";
    contexto.hoja.getRange(fila, contexto.columnas.estado + 1).setValue(estadoTexto);
    SpreadsheetApp.flush();

    const guardado = normalizarEstadoConfiguracion_(
      contexto.hoja.getRange(fila, contexto.columnas.estado + 1).getDisplayValue()
    );
    if (guardado !== estadoTexto) {
      throw new Error("Google Sheets no confirmó el estado de configuración esperado.");
    }

    const valores = leerValoresConfiguracion_(contexto);
    return {
      ok: true,
      clave: claveSegura,
      estado: valores[claveSegura],
      activado: valores[claveSegura] === "ACTIVADO",
      valores: valores,
      actualizadoEn: new Date().toISOString()
    };
  } finally {
    bloqueo.releaseLock();
  }
}

function obtenerContextoConfiguracion_() {
  const libro = SpreadsheetApp.openById(INVENTARIO_SPREADSHEET_ID);
  const hoja = libro.getSheetByName(CONFIG_SHEET_NAME);
  if (!hoja) {
    throw new Error("No existe la pestaña Configuracion en el inventario oficial.");
  }

  const filasALeer = Math.min(Math.max(hoja.getLastRow(), 1), 100);
  const columnasALeer = Math.min(Math.max(hoja.getLastColumn(), 1), 30);
  const valores = hoja.getRange(1, 1, filasALeer, columnasALeer).getDisplayValues();
  const candidatos = [];

  valores.forEach(function(fila, indiceFila) {
    const normalizados = fila.map(normalizarEncabezado_);
    const estados = [];
    const claves = [];
    normalizados.forEach(function(valor, indiceColumna) {
      if (valor === normalizarEncabezado_("Estado")) estados.push(indiceColumna);
      if (valor === normalizarEncabezado_("Clave técnica")) claves.push(indiceColumna);
    });
    if (estados.length === 1 && claves.length === 1) {
      candidatos.push({ fila: indiceFila, estado: estados[0], clave: claves[0] });
    }
  });

  if (candidatos.length !== 1) {
    throw new Error(
      "Los encabezados Estado y Clave técnica deben identificar una única tabla en Configuracion."
    );
  }

  const encabezado = candidatos[0];
  const filas = [];
  for (let indiceFila = encabezado.fila + 1; indiceFila < valores.length; indiceFila++) {
    const clave = String(valores[indiceFila][encabezado.clave] || "").trim().toUpperCase();
    if (!clave) continue;
    filas.push({ fila: indiceFila + 1, clave: clave });
  }

  return {
    hoja: hoja,
    columnas: { estado: encabezado.estado, clave: encabezado.clave },
    filas: filas
  };
}

function leerValoresConfiguracion_(contexto) {
  const valores = {};
  CONFIG_KEYS.forEach(function(clave) {
    const coincidencias = contexto.filas.filter(function(item) { return item.clave === clave; });
    if (coincidencias.length !== 1) {
      throw new Error(
        "La clave " + clave + " debe existir exactamente una vez en la pestaña Configuracion."
      );
    }
    const estado = normalizarEstadoConfiguracion_(
      contexto.hoja.getRange(coincidencias[0].fila, contexto.columnas.estado + 1).getDisplayValue()
    );
    if (!estado) {
      throw new Error("La clave " + clave + " no tiene un estado válido en Configuracion.");
    }
    valores[clave] = estado;
  });
  return valores;
}

function normalizarEstadoConfiguracion_(valor) {
  const normalizado = normalizarEncabezado_(valor);
  if (["activado", "activo", "true", "verdadero", "si", "1", "on"].indexOf(normalizado) !== -1) {
    return "ACTIVADO";
  }
  if (["desactivado", "inactivo", "false", "falso", "no", "0", "off"].indexOf(normalizado) !== -1) {
    return "DESACTIVADO";
  }
  return "";
}

function normalizarBooleanoConfiguracion_(valor) {
  if (valor === true) return true;
  if (valor === false) return false;
  const estado = normalizarEstadoConfiguracion_(valor);
  if (estado === "ACTIVADO") return true;
  if (estado === "DESACTIVADO") return false;
  return null;
}'''

          text, n = re.subn(
              r'function obtenerConfiguracionWeb\(\) \{[\s\S]*?function normalizarBooleanoConfiguracion_\(valor\) \{[\s\S]*?\n\}',
              lambda _: functions,
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f'No se reemplazaron funciones de configuración: {n}')

          path.write_text(text, encoding='utf-8', newline='\n')

          # En visibilidad, la última fila para una misma regla prevalece.
          admin = Path('natura/precios-admin.js')
          js = admin.read_text(encoding='utf-8')
          old = 'for(const r of rows||[]){if(r[0]&&r[1]&&["x","si","true","1","oculto"].includes(norm(r[2])))rules.add(key(r[0],r[1]))}'
          new = 'for(const r of rows||[]){if(!r[0]||!r[1])continue;const k=key(r[0],r[1]);["x","si","true","1","oculto"].includes(norm(r[2]))?rules.add(k):rules.delete(k)}'
          if js.count(old) != 1:
              raise SystemExit(f'No se encontró exactamente una carga de reglas legacy: {js.count(old)}')
          js = js.replace(old, new, 1)
          admin.write_text(js, encoding='utf-8', newline='\n')
          PY

          git diff --check
          git diff -- natura/catalogo-app.js 'natura/apps-script/administrar precios natura/Código.js' natura/precios-admin.js

      - name: Confirmar cambios en main
        shell: bash
        run: |
          git config user.name 'stock'
          git config user.email '131928432+irenismb@users.noreply.github.com'
          git add natura/catalogo-app.js 'natura/apps-script/administrar precios natura/Código.js' natura/precios-admin.js
          if git diff --cached --quiet; then
            echo '::error::No hubo cambios que confirmar'
            exit 1
          fi
          git commit -m 'Administrar configuración web con backend seguro en Google Sheets'
          git push origin HEAD:main
