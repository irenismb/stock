name: Ajustar textos de la pagina de reparacion

on:
  push:
    paths:
      - .github/workflows/ajustar-textos-reparacion-2026-07-25.yml

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Crear copia y ajustar tipografia
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          origen = Path("reparación/reparación_de_computadores_santa_marta.html")
          copia = Path("reparación/copias/2026-07-25_reparacion-de-computadores-antes-de-aumentar-textos.html")

          if not origen.exists():
              raise SystemExit(f"No existe el archivo: {origen}")

          copia.parent.mkdir(parents=True, exist_ok=True)
          if copia.exists():
              raise SystemExit(f"La copia ya existe: {copia}")

          shutil.copy2(origen, copia)
          texto = origen.read_text(encoding="utf-8")

          reemplazos = [
              (
                  ".service strong { display:block; color:var(--navy); font-size:.88rem; line-height:1.08; }",
                  ".service strong { display:block; color:var(--navy); font-size:.94rem; line-height:1.08; }",
              ),
              (
                  ".service small { display:block; margin-top:3px; color:var(--muted); font-size:.72rem; line-height:1.12; }",
                  ".service small { display:block; margin-top:3px; color:var(--muted); font-size:.75rem; line-height:1.14; }",
              ),
              (
                  "      font-weight:900;\n      text-align:center;\n    }\n    .button svg",
                  "      font-weight:900;\n      font-size:.94rem;\n      line-height:1.08;\n      text-align:center;\n    }\n    .button svg",
              ),
              (
                  ".trust-item strong { display:block; color:var(--navy); font-size:.76rem; line-height:1.05; }",
                  ".trust-item strong { display:block; color:var(--navy); font-size:.82rem; line-height:1.06; }",
              ),
              (
                  ".trust-item small { display:block; margin-top:2px; color:var(--muted); font-size:.65rem; line-height:1.08; }",
                  ".trust-item small { display:block; margin-top:2px; color:var(--muted); font-size:.68rem; line-height:1.1; }",
              ),
              (
                  ".summary-action { color:#d1fae5; font-weight:900; white-space:nowrap; }",
                  ".summary-action { color:#d1fae5; font-size:.86rem; line-height:1; font-weight:900; white-space:nowrap; }",
              ),
              (
                  "    .visitor-details:not([open]) .visitor-summary {\n      min-height:var(--compact-card-height);",
                  "    .visitor-details:not([open]) .visitor-summary {\n      min-height:var(--compact-card-height);\n      padding:0 10px;",
              ),
              (
                  "      .service strong { font-size:.76rem; }",
                  "      .service strong { font-size:.82rem; }",
              ),
              (
                  "      .service small { font-size:.62rem; line-height:1.06; }",
                  "      .service small { font-size:.66rem; line-height:1.08; }",
              ),
              (
                  "      .button { min-height:37px; padding:6px 8px; font-size:.79rem; }",
                  "      .button { min-height:37px; padding:6px 8px; font-size:.85rem; }",
              ),
              (
                  "      .trust-item strong { font-size:.65rem; }",
                  "      .trust-item strong { font-size:.70rem; }",
              ),
              (
                  "      .trust-item small { font-size:.56rem; }",
                  "      .trust-item small { font-size:.59rem; }",
              ),
              (
                  "      .summary-item { font-size:.74rem; white-space:normal; }",
                  "      .summary-item { font-size:.78rem; white-space:normal; }",
              ),
              (
                  "      .button { font-size:.73rem; }",
                  "      .button { font-size:.80rem; }",
              ),
          ]

          for anterior, nuevo in reemplazos:
              cantidad = texto.count(anterior)
              if cantidad != 1:
                  raise SystemExit(f"Se esperaba una coincidencia y se encontraron {cantidad}: {anterior[:80]}")
              texto = texto.replace(anterior, nuevo, 1)

          origen.write_text(texto, encoding="utf-8", newline="\n")
          PY

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "reparación/reparación_de_computadores_santa_marta.html" "reparación/copias/2026-07-25_reparacion-de-computadores-antes-de-aumentar-textos.html"
          git commit -m "Mejorar legibilidad de textos en botones"
          git push
