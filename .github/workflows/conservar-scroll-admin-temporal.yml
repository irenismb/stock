name: Conservar scroll en modo administrador

on:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/conservar-scroll-admin-temporal.txt'

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Evitar desplazamiento automatico en administracion
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          js_path = Path('natura/catalogo-app.js')
          js = js_path.read_text(encoding='utf-8')
          old = '''function uxScrollToCatalogStart(){
  const target=document.querySelector("main")||grid;
  if(!target) return;
  const y=Math.max(0,target.getBoundingClientRect().top+window.scrollY-86);
  requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:"smooth"}));
}'''
          new = '''function uxScrollToCatalogStart(){
  // En modo administrador se conserva la posición para no interrumpir el trabajo
  // al entrar en categorías, subcategorías o familias.
  if(window.CATALOG_ADMIN_MODE_ACTIVE) return;
  const target=document.querySelector("main")||grid;
  if(!target) return;
  const y=Math.max(0,target.getBoundingClientRect().top+window.scrollY-86);
  requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:"smooth"}));
}'''
          count = js.count(old)
          if count != 1:
              raise SystemExit(f'Se esperaba una función uxScrollToCatalogStart exacta; encontradas: {count}')
          js_path.write_text(js.replace(old, new, 1), encoding='utf-8', newline='\n')

          html_path = Path('natura/catalogo.html')
          html = html_path.read_text(encoding='utf-8')
          pattern = r'catalogo-app\.js\?actualizacion=integral-2026-09-13-(\d+)'
          matches = re.findall(pattern, html)
          if len(matches) != 1:
              raise SystemExit(f'Se esperaba una referencia versionada de catalogo-app.js; encontradas: {matches}')
          current = int(matches[0])
          html = re.sub(pattern, f'catalogo-app.js?actualizacion=integral-2026-09-13-{current+1}', html, count=1)
          html_path.write_text(html, encoding='utf-8', newline='\n')
          PY

          node --check natura/catalogo-app.js
          git diff --check
          git diff -- natura/catalogo-app.js natura/catalogo.html

      - name: Confirmar cambios en main
        shell: bash
        run: |
          git config user.name 'stock'
          git config user.email '131928432+irenismb@users.noreply.github.com'
          git add natura/catalogo-app.js natura/catalogo.html
          if git diff --cached --quiet; then
            echo '::error::No hubo cambios que confirmar'
            exit 1
          fi
          git commit -m 'Conservar posicion al navegar en modo administrador'
          git push origin HEAD:main
