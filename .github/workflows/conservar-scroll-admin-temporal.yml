name: Limpiar scroll en modo administrador

on:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/conservar-scroll-admin-temporal.txt'

permissions:
  contents: write

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Dejar una sola condicion de administracion
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          js_path = Path('natura/catalogo-app.js')
          js = js_path.read_text(encoding='utf-8')
          block = '  // En administración se conserva la posición al navegar entre niveles.\n  if(window.CATALOG_ADMIN_MODE_ACTIVE) return;\n'
          double = block + block
          count = js.count(double)
          if count != 1:
              raise SystemExit(f'Se esperaba un bloque duplicado exacto; encontrados: {count}')
          js_path.write_text(js.replace(double, block, 1), encoding='utf-8', newline='\n')
          html_path = Path('natura/catalogo.html')
          html = html_path.read_text(encoding='utf-8')
          pattern = r'catalogo-app\.js\?actualizacion=integral-2026-09-13-(\d+)'
          matches = re.findall(pattern, html)
          if len(matches) != 1:
              raise SystemExit(f'Referencia versionada inesperada: {matches}')
          current = int(matches[0])
          html = re.sub(pattern, f'catalogo-app.js?actualizacion=integral-2026-09-13-{current+1}', html, count=1)
          html_path.write_text(html, encoding='utf-8', newline='\n')
          PY
          node --check natura/catalogo-app.js
          git diff --check
          git diff -- natura/catalogo-app.js natura/catalogo.html

      - name: Confirmar limpieza en main
        shell: bash
        run: |
          git config user.name 'stock'
          git config user.email '131928432+irenismb@users.noreply.github.com'
          git add natura/catalogo-app.js natura/catalogo.html
          git commit -m 'Limpiar condicion de scroll del modo administrador'
          git push origin HEAD:main
