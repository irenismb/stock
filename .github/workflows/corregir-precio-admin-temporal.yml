name: Corregir editor de precios administrador

on:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/corregir-precio-admin-temporal.txt'

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Corregir separación del precio y Guardar
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          js_path = Path('natura/precios-admin.js')
          js = js_path.read_text(encoding='utf-8')
          old = '.price-admin-editor{display:grid;grid-template-columns:minmax(90px,1fr) auto;gap:7px;flex:1 1 220px}.price-admin-input{width:100%;height:40px;padding:8px;border:1px solid #d8c9c6;border-radius:10px;text-align:right;font:750 15px Arial}.price-admin-save{min-width:82px}'
          new = '.price-admin-editor{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;row-gap:7px;flex:1 1 220px;min-width:0;width:100%}.price-admin-input{box-sizing:border-box;min-width:0;width:100%;height:40px;padding:8px;border:1px solid #d8c9c6;border-radius:10px;text-align:right;font:750 15px Arial}.price-admin-save{box-sizing:border-box;min-width:88px}'
          if js.count(old) != 1:
              raise SystemExit(f'No se encontró exactamente una regla del editor de precios: {js.count(old)}')
          js = js.replace(old, new, 1)

          media_old = '@media(max-width:640px){.catalog-admin-config-row{grid-template-columns:1fr}.catalog-admin-switch{width:100%}}'
          media_new = '@media(max-width:640px){.catalog-admin-config-row{grid-template-columns:1fr}.catalog-admin-switch{width:100%}}\n  @media(max-width:380px){.price-admin-editor{grid-template-columns:1fr}.price-admin-save{width:100%}}'
          if js.count(media_old) != 1:
              raise SystemExit(f'No se encontró exactamente un bloque responsive esperado: {js.count(media_old)}')
          js = js.replace(media_old, media_new, 1)
          js_path.write_text(js, encoding='utf-8', newline='\n')

          html_path = Path('natura/catalogo.html')
          html = html_path.read_text(encoding='utf-8')
          old_src = 'precios-admin.js?actualizacion=2026-09-13-2'
          new_src = 'precios-admin.js?actualizacion=2026-09-13-3'
          if html.count(old_src) != 1:
              raise SystemExit(f'No se encontró exactamente una referencia de precios-admin esperada: {html.count(old_src)}')
          html_path.write_text(html.replace(old_src, new_src, 1), encoding='utf-8', newline='\n')
          PY

          git diff --check
          git diff -- natura/precios-admin.js natura/catalogo.html

      - name: Confirmar cambios en main
        shell: bash
        run: |
          git config user.name 'stock'
          git config user.email '131928432+irenismb@users.noreply.github.com'
          git add natura/precios-admin.js natura/catalogo.html
          if git diff --cached --quiet; then
            echo '::error::No hubo cambios que confirmar'
            exit 1
          fi
          git commit -m 'Corregir separación entre precio y Guardar en administrador'
          git push origin HEAD:main
