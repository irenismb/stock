name: Corregir visibilidad en albumes

on:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/corregir-visibilidad-album-temporal.txt'

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Separar visibilidad del contador
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          js_path = Path('natura/precios-admin.js')
          js = js_path.read_text(encoding='utf-8')

          old_css = '.card,.album-card{position:relative}.catalog-admin-vis{position:absolute;z-index:20;top:8px;right:8px}'
          new_css = '''.card,.album-card{position:relative}.catalog-admin-vis{position:absolute;z-index:20;top:8px;right:8px}
  .album-card.catalog-admin-has-vis .album-card-top{display:grid!important;grid-template-columns:auto minmax(0,1fr)!important;grid-template-areas:"icon count" "icon vis";align-items:start!important;column-gap:14px!important;row-gap:7px!important}
  .album-card.catalog-admin-has-vis .album-icon{grid-area:icon}
  .album-card.catalog-admin-has-vis .album-count-badge{grid-area:count;justify-self:end}
  .album-card.catalog-admin-has-vis .catalog-admin-vis{grid-area:vis;position:static;z-index:auto;justify-self:end;max-width:100%}
  .album-card.catalog-admin-has-vis .catalog-admin-vis button{max-width:100%;padding:6px 9px;line-height:1.15;white-space:normal;text-align:center}'''
          if js.count(old_css) != 1:
              raise SystemExit(f'CSS base inesperado: {js.count(old_css)} coincidencias')
          js = js.replace(old_css, new_css, 1)

          old_remove = 'function removeAdminUI(){document.getElementById("catalogAdminConfig")?.remove();grid.querySelectorAll(".catalog-admin-vis").forEach(x=>x.remove());grid.querySelectorAll(".catalog-admin-hidden,.catalog-admin-inherited").forEach(x=>x.classList.remove("catalog-admin-hidden","catalog-admin-inherited"));grid.querySelectorAll(".card").forEach(removePrice)}'
          new_remove = 'function removeAdminUI(){document.getElementById("catalogAdminConfig")?.remove();grid.querySelectorAll(".catalog-admin-vis").forEach(x=>x.remove());grid.querySelectorAll(".catalog-admin-has-vis").forEach(x=>x.classList.remove("catalog-admin-has-vis"));grid.querySelectorAll(".catalog-admin-hidden,.catalog-admin-inherited").forEach(x=>x.classList.remove("catalog-admin-hidden","catalog-admin-inherited"));grid.querySelectorAll(".card").forEach(removePrice)}'
          if js.count(old_remove) != 1:
              raise SystemExit(f'removeAdminUI inesperado: {js.count(old_remove)} coincidencias')
          js = js.replace(old_remove, new_remove, 1)

          old_append = 'w.appendChild(b);card.appendChild(w)}'
          new_append = 'w.appendChild(b);if(card.classList.contains("album-card")){card.classList.add("catalog-admin-has-vis");const top=card.querySelector(".album-card-top");(top||card).appendChild(w)}else{card.appendChild(w)}}'
          if js.count(old_append) != 1:
              raise SystemExit(f'addVisButton inesperado: {js.count(old_append)} coincidencias')
          js = js.replace(old_append, new_append, 1)
          js_path.write_text(js, encoding='utf-8', newline='\n')

          html_path = Path('natura/catalogo.html')
          html = html_path.read_text(encoding='utf-8')
          old_src = 'precios-admin.js?actualizacion=2026-09-13-3'
          new_src = 'precios-admin.js?actualizacion=2026-09-13-4'
          if html.count(old_src) != 1:
              raise SystemExit(f'Versión de precios-admin inesperada: {html.count(old_src)} coincidencias')
          html_path.write_text(html.replace(old_src, new_src, 1), encoding='utf-8', newline='\n')
          PY

          node --check natura/precios-admin.js
          git diff --check
          git diff -- natura/precios-admin.js natura/catalogo.html

      - name: Confirmar cambios en main
        shell: bash
        run: |
          git config user.name 'stock'
          git config user.email '131928432+irenismb@users.noreply.github.com'
          git add natura/precios-admin.js natura/catalogo.html
          if git diff --cached --quiet; then
            echo '::error::No hubo cambios que confirmar'
            exit 1
          fi
          git commit -m 'Separar control de visibilidad del contador de albumes'
          git push origin HEAD:main
