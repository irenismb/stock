name: Eliminar contador duplicado de reparación

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/eliminar-contador-duplicado-reparacion.yml

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ocultar únicamente el contador interno
        shell: python
        run: |
          from pathlib import Path

          ruta = Path("reparación/reparación_de_computadores_santa_marta.html")
          texto = ruta.read_text(encoding="utf-8")
          marcador = '<style id="ocultar-contador-interno">.visitor-week-shell{display:none!important}</style>'

          if marcador not in texto:
              if "</head>" not in texto:
                  raise SystemExit("No se encontró el cierre de head.")
              texto = texto.replace("</head>", marcador + "</head>", 1)
              ruta.write_text(texto, encoding="utf-8", newline="\n")

      - name: Publicar corrección
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "reparación/reparación_de_computadores_santa_marta.html"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Eliminar contador duplicado de la página principal"
          git push
