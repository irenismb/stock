name: Mejorar navegación del administrador

on:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/mejorar-admin-navegacion-temporal.txt'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ajustar scroll y panel contraible
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('natura/catalogo-app.js')
          app = app_path.read_text(encoding='utf-8')
          old_scroll = '''function uxScrollToCatalogStart(){
  // En administración se conserva la posición al navegar entre niveles.
  if(window.CATALOG_ADMIN_MODE_ACTIVE) return;
  const target=document.querySelector("main")||grid;
  if(!target) return;
  const y=Math.max(0,target.getBoundingClientRect().top+window.scrollY-86);
  requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:"smooth"}));
}'''
          new_scroll = '''function uxScrollToCatalogStart(){
  let target=document.querySelector("main")||grid;
  if(window.CATALOG_ADMIN_MODE_ACTIVE&&grid){
    const first=Array.from(grid.children).find(el=>{
      if(!el||!el.matches?.(".album-card,.card")||el.hidden) return false;
      const style=window.getComputedStyle(el);
      return style.display!=="none"&&style.visibility!=="hidden";
    });
    target=first||grid;
  }
  if(!target) return;
  const y=Math.max(0,target.getBoundingClientRect().top+window.scrollY-86);
  requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:"smooth"}));
}'''
          if app.count(old_scroll) != 1:
              raise SystemExit(f'Función de scroll inesperada: {app.count(old_scroll)} coincidencias')
          app_path.write_text(app.replace(old_scroll, new_scroll, 1), encoding='utf-8', newline='\n')

          admin_path = Path('natura/precios-admin.js')
          admin = admin_path.read_text(encoding='utf-8')

          old_css1 = '.catalog-admin-config{margin:14px 0 20px;padding:16px;border:1px solid #e3d5d2;border-radius:18px;background:#fffaf9;box-shadow:0 8px 24px #5d35400d}'
          new_css1 = '.catalog-admin-config{margin:14px 0 20px;padding:10px 12px;border:1px solid #e3d5d2;border-radius:18px;background:#fffaf9;box-shadow:0 8px 24px #5d35400d}'
          if admin.count(old_css1) != 1:
              raise SystemExit(f'CSS contenedor inesperado: {admin.count(old_css1)}')
          admin = admin.replace(old_css1, new_css1, 1)

          old_css2 = '.catalog-admin-config-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}.catalog-admin-config h2{margin:0;color:#352b2c;font:900 18px/1.2 Arial}.catalog-admin-config-note{margin:5px 0 0;color:#78696b;font:13px/1.35 Arial}'
          new_css2 = '.catalog-admin-config-head{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0}.catalog-admin-config-collapse{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:transparent;color:#352b2c;font:900 14px/1.2 Arial;cursor:pointer;padding:2px 0;text-align:left}.catalog-admin-config-collapse-state{color:#8d5360;font:800 11px Arial}.catalog-admin-config-body{padding-top:12px}.catalog-admin-config-body[hidden]{display:none!important}.catalog-admin-config-note{margin:0 0 12px;color:#78696b;font:13px/1.35 Arial}'
          if admin.count(old_css2) != 1:
              raise SystemExit(f'CSS cabecera inesperado: {admin.count(old_css2)}')
          admin = admin.replace(old_css2, new_css2, 1)

          old_html = 'panel.innerHTML=`<div class="catalog-admin-config-head"><div><h2>Configuración del catálogo</h2><p class="catalog-admin-config-note">Los controles públicos se guardan en Google automáticamente. El filtro de administración solo afecta esta sesión.</p></div></div><div class="catalog-admin-config-list">${rows}${adminFilter}</div><p class="catalog-admin-config-status" id="catalogAdminConfigStatus" role="status" aria-live="polite"></p>`;'
          new_html = 'panel.innerHTML=`<div class="catalog-admin-config-head"><button type="button" class="catalog-admin-config-collapse" data-admin-config-collapse aria-expanded="false" aria-controls="catalogAdminConfigBody"><span>⚙ Configuración del catálogo</span><span class="catalog-admin-config-collapse-state">Mostrar</span></button></div><div class="catalog-admin-config-body" id="catalogAdminConfigBody" hidden><p class="catalog-admin-config-note">Los controles públicos se guardan en Google automáticamente. El filtro de administración solo afecta esta sesión.</p><div class="catalog-admin-config-list">${rows}${adminFilter}</div><p class="catalog-admin-config-status" id="catalogAdminConfigStatus" role="status" aria-live="polite"></p></div>`;'
          if admin.count(old_html) != 1:
              raise SystemExit(f'HTML panel inesperado: {admin.count(old_html)}')
          admin = admin.replace(old_html, new_html, 1)

          old_listener = 'panel.addEventListener("click",e=>{const local=e.target.closest("[data-admin-missing-price-toggle]");if(local&&!local.disabled){toggleAdminMissingPrice(local);return}const b=e.target.closest("[data-config-toggle]");if(b&&!b.disabled)saveConfigToggle(b)});'
          new_listener = 'panel.addEventListener("click",e=>{const collapse=e.target.closest("[data-admin-config-collapse]");if(collapse){const body=panel.querySelector("#catalogAdminConfigBody"),expanded=collapse.getAttribute("aria-expanded")==="true";collapse.setAttribute("aria-expanded",expanded?"false":"true");if(body)body.hidden=expanded;const state=collapse.querySelector(".catalog-admin-config-collapse-state");if(state)state.textContent=expanded?"Mostrar":"Ocultar";return}const local=e.target.closest("[data-admin-missing-price-toggle]");if(local&&!local.disabled){toggleAdminMissingPrice(local);return}const b=e.target.closest("[data-config-toggle]");if(b&&!b.disabled)saveConfigToggle(b)});'
          if admin.count(old_listener) != 1:
              raise SystemExit(f'Listener panel inesperado: {admin.count(old_listener)}')
          admin_path.write_text(admin.replace(old_listener, new_listener, 1), encoding='utf-8', newline='\n')

          html_path = Path('natura/catalogo.html')
          html = html_path.read_text(encoding='utf-8')
          replacements = {
              'catalogo-app.js?actualizacion=integral-2026-09-13-11': 'catalogo-app.js?actualizacion=integral-2026-09-13-12',
              'precios-admin.js?actualizacion=2026-09-13-4': 'precios-admin.js?actualizacion=2026-09-13-5',
          }
          for old, new in replacements.items():
              if html.count(old) != 1:
                  raise SystemExit(f'Versión inesperada {old}: {html.count(old)}')
              html = html.replace(old, new, 1)
          html_path.write_text(html, encoding='utf-8', newline='\n')
          PY

          node --check natura/catalogo-app.js
          node --check natura/precios-admin.js
          git diff --check
          git diff -- natura/catalogo-app.js natura/precios-admin.js natura/catalogo.html

      - name: Confirmar cambios en main
        shell: bash
        run: |
          git config user.name 'stock'
          git config user.email '131928432+irenismb@users.noreply.github.com'
          git add natura/catalogo-app.js natura/precios-admin.js natura/catalogo.html
          if git diff --cached --quiet; then
            echo '::error::No hubo cambios que confirmar'
            exit 1
          fi
          git commit -m 'Mejorar navegación y contraer configuración del administrador'
          git push origin HEAD:main
