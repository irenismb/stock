name: Mejorar collage y registro de ventas

on:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/mejorar-collage-ventas-temporal.txt'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar mejoras
        run: |
          python3 <<'PY'
          from pathlib import Path

          app_path = Path('natura/catalogo-app.js')
          html_path = Path('natura/catalogo.html')
          s = app_path.read_text(encoding='utf-8')

          def rep(old, new, expected=1):
              global s
              count = s.count(old)
              if count != expected:
                  raise SystemExit(f'Reemplazo inesperado: se esperaban {expected} coincidencias y hay {count}: {old[:120]!r}')
              s = s.replace(old, new, expected)

          # Pedidos vs ventas.
          rep('    function buildOrderPayload(){', '    function buildOrderPayload(tipoMovimiento="Pedido"){')
          rep(
              '      return {\n        source: "catalogo-whatsapp",\n',
              '      tipoMovimiento = normalizeText(tipoMovimiento) === "venta" ? "Venta" : "Pedido";\n\n      return {\n        source: tipoMovimiento === "Venta" ? "catalogo-factura" : "catalogo-whatsapp",\n        tipoMovimiento,\n'
          )
          rep(
              '    async function registerOrderInSheet(){\n      const payload = buildOrderPayload();',
              '    async function registerOrderInSheet(tipoMovimiento="Pedido"){\n      const payload = buildOrderPayload(tipoMovimiento);'
          )
          rep('            await registerOrderInSheet();', '            await registerOrderInSheet("Pedido");')
          rep(
              '          const result = await invoiceGeneratePngFromCart();\n          if(result.copied && result.downloaded){',
              '          const result = await invoiceGeneratePngFromCart();\n          let saleRegistrationError = null;\n          if(result.copied || result.downloaded){\n            try{\n              await registerOrderInSheet("Venta");\n            }catch(err){\n              saleRegistrationError = err;\n              console.error("No se pudo registrar la venta en Google Sheets:", err);\n            }\n          }\n          if(result.copied && result.downloaded){'
          )
          rep(
              '          }else{\n            throw new Error("No se pudo copiar ni descargar la factura.");\n          }\n        }catch(err){',
              '          }else{\n            throw new Error("No se pudo copiar ni descargar la factura.");\n          }\n          if(saleRegistrationError){\n            alert("La factura se generó, pero no se pudo registrar la venta en el libro de pedidos. Intenta nuevamente cuando tengas conexión.");\n          }\n        }catch(err){'
          )

          # Acciones del collage: Messenger y Facebook copian al portapapeles y descargan.
          rep(
              '        <div class="collage-output-actions">\n          <button class="collage-share" id="collageShareBtn" type="button" disabled>Preparando imagen…</button>\n        </div>',
              '        <div class="collage-output-actions" id="collageGenericActions">\n          <button class="collage-share" id="collageShareBtn" type="button" disabled>Preparando imagen…</button>\n        </div>\n        <div class="collage-social-actions" id="collageSocialActions" hidden>\n          <button class="collage-social-btn" id="collageMessengerBtn" type="button" data-channel-label="Messenger" disabled>Messenger</button>\n          <button class="collage-social-btn" id="collageFacebookBtn" type="button" data-channel-label="Facebook" disabled>Facebook</button>\n        </div>'
          )
          rep(
              '    .collage-output-actions{display:flex;justify-content:center;align-items:center;width:min(590px,100%)}',
              '    .collage-output-actions{display:flex;justify-content:center;align-items:center;width:min(590px,100%)}\n    .collage-output-actions[hidden],.collage-social-actions[hidden]{display:none!important}\n    .collage-social-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(590px,100%)}\n    .collage-social-btn{min-height:48px;padding:11px 20px;border-radius:13px;border:1px solid #b9954f;background:#fff7ea;color:#8d5360;font-weight:950;cursor:pointer;box-shadow:0 8px 22px rgba(185,149,79,.14)}\n    .collage-social-btn:hover:not(:disabled){background:#fff0cf;border-color:#b9954f;transform:translateY(-1px)}\n    .collage-social-btn:disabled{opacity:.6;cursor:wait}'
          )
          rep(
              '      .collage-type-option,.collage-format-option,.collage-download,.collage-share{width:100%;max-width:320px}',
              '      .collage-type-option,.collage-format-option,.collage-download,.collage-share,.collage-social-btn{width:100%;max-width:320px}\n      .collage-social-actions{grid-template-columns:1fr;max-width:320px}'
          )
          rep(
              '  const shareBtn=modal.querySelector("#collageShareBtn");\n  const formatButtons=',
              '  const shareBtn=modal.querySelector("#collageShareBtn");\n  const genericActions=modal.querySelector("#collageGenericActions");\n  const socialActions=modal.querySelector("#collageSocialActions");\n  const messengerBtn=modal.querySelector("#collageMessengerBtn");\n  const facebookBtn=modal.querySelector("#collageFacebookBtn");\n  const socialButtons=[messengerBtn,facebookBtn].filter(Boolean);\n  const formatButtons='
          )

          old_actions = '''  function setActionPreparing(){
    if(shareBtn){
      shareBtn.disabled=true;
      shareBtn.textContent="Preparando imagen…";
      shareBtn.title="";
    }
    if(downloadBtn){
      downloadBtn.disabled=true;
      downloadBtn.textContent="Preparando PNG…";
    }
  }

  function setActionReady(){
    const ready=collageExportMode==="ficha" ? !!fichaPreparedFile : !!collagePreparedShareFile;
    if(shareBtn){
      shareBtn.disabled=!ready;
      shareBtn.textContent="Copiar y descargar";
      shareBtn.title=canClipboardPng()?"":"Tu navegador podría no permitir copiar imágenes al portapapeles.";
    }
    if(downloadBtn){
      downloadBtn.disabled=!ready;
      downloadBtn.textContent="Descargar PNG";
    }
  }'''
          new_actions = '''  function setActionPreparing(){
    if(collageExportMode==="collage"){
      for(const button of socialButtons){
        const label=button.dataset.channelLabel||button.textContent||"Red social";
        button.disabled=true;
        button.textContent=`${label} · preparando…`;
        button.title="";
      }
    }else if(shareBtn){
      shareBtn.disabled=true;
      shareBtn.textContent="Preparando imagen…";
      shareBtn.title="";
    }
    if(downloadBtn){
      downloadBtn.disabled=true;
      downloadBtn.textContent="Preparando PNG…";
    }
  }

  function setActionReady(){
    const ready=collageExportMode==="ficha" ? !!fichaPreparedFile : !!collagePreparedShareFile;
    if(collageExportMode==="collage"){
      for(const button of socialButtons){
        const label=button.dataset.channelLabel||"Red social";
        button.disabled=!ready;
        button.textContent=label;
        button.title=canClipboardPng()?`${label}: copiar imagen al portapapeles y descargar PNG`:`${label}: descargar PNG; el navegador podría impedir copiar al portapapeles`;
      }
    }else if(shareBtn){
      shareBtn.disabled=!ready;
      shareBtn.textContent="Copiar y descargar";
      shareBtn.title=canClipboardPng()?"":"Tu navegador podría no permitir copiar imágenes al portapapeles.";
    }
    if(downloadBtn){
      downloadBtn.disabled=!ready;
      downloadBtn.textContent="Descargar PNG";
    }
  }'''
          rep(old_actions, new_actions)

          rep(
              '    const isFicha=collageExportMode==="ficha";\n    modal.classList.toggle("is-ficha-mode",isFicha);',
              '    const isFicha=collageExportMode==="ficha";\n    if(genericActions) genericActions.hidden=!isFicha;\n    if(socialActions) socialActions.hidden=isFicha;\n    modal.classList.toggle("is-ficha-mode",isFicha);'
          )

          start = s.index('  shareBtn?.addEventListener("click",async()=>{')
          end = s.index('  modal.addEventListener("click",event=>{', start)
          new_handlers = '''  async function copyAndDownloadForChannel(button){
    const file=collagePreparedShareFile;
    if(!file){
      queueCollageSharePreparation();
      return;
    }
    const label=button?.dataset?.channelLabel||"Red social";
    for(const current of socialButtons) current.disabled=true;
    if(button) button.textContent=`${label} · copiando y descargando…`;

    let copyPromise=null;
    let copyError=null;
    let downloadError=null;
    try{ copyPromise=copyPreparedPngFile(file); }catch(error){ copyError=error; }
    try{ downloadPreparedPngFile(file,file.name); }catch(error){ downloadError=error; }
    if(copyPromise){
      try{ await copyPromise; }catch(error){ copyError=error; }
    }

    if(copyError) console.error(`No se pudo copiar el collage para ${label}.`,copyError);
    if(downloadError) console.error(`No se pudo descargar el collage para ${label}.`,downloadError);

    if(button){
      if(!copyError && !downloadError) button.textContent=`${label} · copiada y descargada`;
      else if(copyError && !downloadError) button.textContent=`${label} · descargada`;
      else if(!copyError && downloadError) button.textContent=`${label} · copiada`;
      else button.textContent=`${label} · no se pudo completar`;
    }

    if(copyError && !downloadError){
      alert("La imagen se descargó, pero este navegador no permitió copiarla al portapapeles.");
    }else if(!copyError && downloadError){
      alert("La imagen se copió al portapapeles, pero el navegador no permitió descargarla.");
    }else if(copyError && downloadError){
      alert("No se pudo copiar ni descargar la imagen.");
    }

    window.setTimeout(()=>{
      if(collageExportMode==="collage") setActionReady();
    },1200);
  }

  messengerBtn?.addEventListener("click",()=>{ void copyAndDownloadForChannel(messengerBtn); });
  facebookBtn?.addEventListener("click",()=>{ void copyAndDownloadForChannel(facebookBtn); });

  shareBtn?.addEventListener("click",async()=>{
    if(collageExportMode!=="ficha") return;
    const file=fichaPreparedFile;
    if(!file){
      queueFichaPreparation();
      return;
    }
    shareBtn.disabled=true;
    shareBtn.textContent="Copiando y descargando…";

    let copyPromise=null;
    let copyError=null;
    let downloadError=null;
    try{ copyPromise=copyPreparedPngFile(file); }catch(error){ copyError=error; }
    try{ downloadPreparedPngFile(file,file.name); }catch(error){ downloadError=error; }
    if(copyPromise){
      try{ await copyPromise; }catch(error){ copyError=error; }
    }

    if(copyError) console.error("No se pudo copiar la ficha al portapapeles.",copyError);
    if(downloadError) console.error("No se pudo descargar la ficha PNG.",downloadError);

    if(!copyError && !downloadError) shareBtn.textContent="Copiada y descargada";
    else if(copyError && !downloadError) shareBtn.textContent="Descargada";
    else if(!copyError && downloadError) shareBtn.textContent="Copiada";
    else shareBtn.textContent="No se pudo completar";

    window.setTimeout(()=>{
      if(collageExportMode==="ficha") setActionReady();
    },1200);
  });

'''
          s = s[:start] + new_handlers + s[end:]

          # Renderizado del collage con supersampling 2x, conservando la dimensión final elegida.
          rep(
              '      const PAGE_W=format.pageW;\n      const PAGE_H=format.pageH;\n      const MARGIN=format.margin;',
              '      const PAGE_W=format.pageW;\n      const PAGE_H=format.pageH;\n      const MARGIN=format.margin;\n      const RENDER_SCALE=2;'
          )
          rep(
              '      const natural=document.createElement("canvas");\n      natural.width=PAGE_W;\n      natural.height=Math.max(PAGE_H,Math.ceil(naturalH));\n      const ctx=natural.getContext("2d");',
              '      const natural=document.createElement("canvas");\n      const naturalLogicalHeight=Math.max(PAGE_H,Math.ceil(naturalH));\n      natural.width=PAGE_W*RENDER_SCALE;\n      natural.height=naturalLogicalHeight*RENDER_SCALE;\n      const ctx=natural.getContext("2d");\n      ctx.scale(RENDER_SCALE,RENDER_SCALE);'
          )
          rep('      const bgGradient=ctx.createLinearGradient(0,0,0,natural.height);', '      const bgGradient=ctx.createLinearGradient(0,0,0,naturalLogicalHeight);')
          rep('      ctx.fillRect(0,0,natural.width,natural.height);', '      ctx.fillRect(0,0,PAGE_W,naturalLogicalHeight);')
          rep('      ctx.moveTo(PAGE_W,natural.height);', '      ctx.moveTo(PAGE_W,naturalLogicalHeight);')
          rep('      ctx.lineTo(PAGE_W-190,natural.height);', '      ctx.lineTo(PAGE_W-190,naturalLogicalHeight);')
          rep('      ctx.bezierCurveTo(PAGE_W-102,natural.height-70,PAGE_W-92,natural.height-132,PAGE_W,natural.height-190);', '      ctx.bezierCurveTo(PAGE_W-102,naturalLogicalHeight-70,PAGE_W-92,naturalLogicalHeight-132,PAGE_W,naturalLogicalHeight-190);')
          rep('      presentationDrawBotanicalAccent(ctx,PAGE_W-4,natural.height-168,isMarketplace ? .72 : .66,-1,"rgba(186,137,122,.17)");', '      presentationDrawBotanicalAccent(ctx,PAGE_W-4,naturalLogicalHeight-168,isMarketplace ? .72 : .66,-1,"rgba(186,137,122,.17)");')
          rep('      const usedHeight=Math.max(1,Math.min(natural.height,Math.ceil(y+42)));', '      const usedHeight=Math.max(1,Math.min(naturalLogicalHeight,Math.ceil(y+42)));')
          rep(
              '      const fctx=finalCanvas.getContext("2d");\n\n      const finalGradient=',
              '      const fctx=finalCanvas.getContext("2d");\n      fctx.imageSmoothingEnabled=true;\n      fctx.imageSmoothingQuality="high";\n\n      const finalGradient='
          )
          rep(
              '        0,0,PAGE_W,usedHeight,\n        (PAGE_W-drawW)/2,',
              '        0,0,PAGE_W*RENDER_SCALE,usedHeight*RENDER_SCALE,\n        (PAGE_W-drawW)/2,'
          )

          app_path.write_text(s, encoding='utf-8')

          html = html_path.read_text(encoding='utf-8')
          old_cache = 'catalogo-app.js?actualizacion=integral-2026-09-13-12'
          new_cache = 'catalogo-app.js?actualizacion=integral-2026-09-13-13'
          if html.count(old_cache) != 1:
              raise SystemExit(f'No se encontró una única versión de caché esperada: {old_cache}')
          html = html.replace(old_cache, new_cache, 1)
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Validar JavaScript
        run: |
          node --check natura/catalogo-app.js
          grep -F 'tipoMovimiento === "Venta" ? "catalogo-factura" : "catalogo-whatsapp"' natura/catalogo-app.js
          grep -F 'id="collageMessengerBtn"' natura/catalogo-app.js
          grep -F 'id="collageFacebookBtn"' natura/catalogo-app.js
          grep -F 'const RENDER_SCALE=2;' natura/catalogo-app.js
          grep -F 'registerOrderInSheet("Venta")' natura/catalogo-app.js
          grep -F 'registerOrderInSheet("Pedido")' natura/catalogo-app.js
          grep -F 'catalogo-app.js?actualizacion=integral-2026-09-13-13' natura/catalogo.html

      - name: Guardar cambios
        run: |
          git config user.name "stock"
          git config user.email "131928432+irenismb@users.noreply.github.com"
          git add natura/catalogo-app.js natura/catalogo.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi
          git commit -m "Mejorar collage y registrar factura como venta"
          git push origin main
