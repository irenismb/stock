name: Mejorar collage y registro de ventas

on:
  push:
    branches:
      - main
    paths:
      - '.github/triggers/mejorar-collage-ventas-temporal.txt'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Aplicar parche
        run: python3 scripts/temp_patch_collage_ventas.py

      - name: Validar JavaScript
        run: |
          node --check natura/catalogo-app.js
          grep -F 'tipoMovimiento === "Venta" ? "catalogo-factura" : "catalogo-whatsapp"' natura/catalogo-app.js
          grep -F 'id="collageMessengerBtn"' natura/catalogo-app.js
          grep -F 'id="collageFacebookBtn"' natura/catalogo-app.js
          grep -F 'const RENDER_SCALE=2;' natura/catalogo-app.js
          grep -F 'registerOrderInSheet("Venta")' natura/catalogo-app.js
          grep -F 'registerOrderInSheet("Pedido")' natura/catalogo-app.js
          grep -F 'catalogo-app.js?actualizacion=integral-2026-09-13-13' natura/catalogo.html

      - name: Guardar cambios
        run: |
          git config user.name "stock"
          git config user.email "131928432+irenismb@users.noreply.github.com"
          git add natura/catalogo-app.js natura/catalogo.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi
          git commit -m "Mejorar collage y registrar factura como venta"
          git push origin main
