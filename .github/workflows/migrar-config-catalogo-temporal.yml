name: Migrar configuración del catálogo a Apps Script

on:
  push:
    paths:
      - '.github/triggers/migrar-config-catalogo-temporal.txt'

permissions:
  contents: write

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Cargar configuración antes del catálogo
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('natura/catalogo.html')
          text = path.read_text(encoding='utf-8')

          old = '''  <script src="catalogo-app.js?actualizacion=integral-2026-09-13-5"></script>\n  <script src="analytics-visitas.js?actualizacion=integral-2026-09-12"></script>\n  <script src="catalogo-ui.js?actualizacion=integral-2026-09-12"></script>\n  <script src="precios-admin-config.js?actualizacion=2026-09-12-1"></script>\n  <script src="precios-admin.js?actualizacion=2026-09-13-1"></script>'''
          new = '''  <script src="precios-admin-config.js?actualizacion=2026-09-13-2"></script>\n  <script src="catalogo-app.js?actualizacion=integral-2026-09-13-6"></script>\n  <script src="analytics-visitas.js?actualizacion=integral-2026-09-12"></script>\n  <script src="catalogo-ui.js?actualizacion=integral-2026-09-12"></script>\n  <script src="precios-admin.js?actualizacion=2026-09-13-2"></script>'''
          if text.count(old) != 1:
              raise SystemExit(f'Bloque de scripts esperado no encontrado exactamente una vez: {text.count(old)}')
          text = text.replace(old, new, 1)

          old_button = '''        <button class="btn-ghost" id="priceAdminBtn" type="button" hidden aria-label="Administrar precios">\n          Precios\n        </button>'''
          new_button = '''        <button class="btn-ghost" id="priceAdminBtn" type="button" hidden aria-label="Administrar catálogo">\n          Administrar\n        </button>'''
          if text.count(old_button) != 1:
              raise SystemExit(f'Botón administrador esperado no encontrado exactamente una vez: {text.count(old_button)}')
          text = text.replace(old_button, new_button, 1)

          path.write_text(text, encoding='utf-8', newline='\n')
          PY

          git diff --check
          git diff -- natura/catalogo.html
      - name: Confirmar cambio en main
        shell: bash
        run: |
          if git diff --quiet -- natura/catalogo.html; then
            echo '::error::No hubo cambios en catalogo.html'
            exit 1
          fi
          git config user.name 'stock'
          git config user.email '131928432+irenismb@users.noreply.github.com'
          git add natura/catalogo.html
          git commit -m 'Integrar configuración web antes de cargar el catálogo'
          git push origin HEAD:main
