name: Migrar imágenes de productos a Drive

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/migrate-product-images.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar cambio validado
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/catalog.patch
          git apply --check /tmp/catalog.patch
          git apply /tmp/catalog.patch
          node --check natura/catalogo-app.js
          test "$(git hash-object natura/catalogo-app.js)" = "324cc0e5874b189fc7c6be17c9ab4581815160a1"
          test "$(git hash-object natura/catalogo.html)" = "900d3be467431e7bf254807d8eb5f42c8b311ad3"
      - name: Guardar cambio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add natura/catalogo-app.js natura/catalogo.html
          git commit -m "Usar Drive/Hatchable para imágenes de productos"
          git push origin main
