name: Publicar Apps Script de Natura

on:
  push:
    branches:
      - main
    paths:
      - "natura/apps-script/*/**"
  workflow_dispatch:
    inputs:
      project:
        description: Nombre de la carpeta del proyecto que se publicará en Google Apps Script
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publicar-apps-script-natura
  cancel-in-progress: false

jobs:
  publicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Identificar proyectos modificados, renombrados o eliminados
        id: projects
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          SELECTED_PROJECT: ${{ inputs.project }}
        run: |
          projects_file="$RUNNER_TEMP/projects.txt"
          renamed_projects_file="$RUNNER_TEMP/renamed-projects.txt"
          deleted_projects_file="$RUNNER_TEMP/deleted-projects.txt"
          : > "$projects_file"
          : > "$renamed_projects_file"
          : > "$deleted_projects_file"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            project_dir="natura/apps-script/$SELECTED_PROJECT"
            if [ ! -d "$project_dir" ]; then
              echo "::error::El proyecto seleccionado ya no existe en el repositorio: $SELECTED_PROJECT"
              exit 1
            fi
            printf '%s\n' "$SELECTED_PROJECT" > "$projects_file"
          else
            changed_projects="$RUNNER_TEMP/changed-projects.txt"
            old_projects="$RUNNER_TEMP/old-projects.txt"
            current_projects="$RUNNER_TEMP/current-projects.txt"
            disappeared_projects="$RUNNER_TEMP/disappeared-projects.txt"

            git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- "natura/apps-script/*/**" |
              awk -F/ 'NF >= 4 {print $3}' |
              sort -u > "$changed_projects"

            git ls-tree -r --name-only "$BEFORE_SHA" -- "natura/apps-script" |
              awk -F/ 'NF == 4 && $4 == ".clasp.json" {print $3}' |
              sort -u > "$old_projects"

            find natura/apps-script -mindepth 2 -maxdepth 2 -type f -name .clasp.json -print |
              awk -F/ 'NF == 4 {print $3}' |
              sort -u > "$current_projects"

            comm -23 "$old_projects" "$current_projects" > "$disappeared_projects"

            while IFS= read -r project; do
              [ -n "$project" ] || continue
              if [ -d "natura/apps-script/$project" ]; then
                printf '%s\n' "$project" >> "$projects_file"
              fi
            done < "$changed_projects"

            while IFS= read -r project; do
              [ -n "$project" ] || continue
              old_config_path="natura/apps-script/$project/.clasp.json"

              if ! old_config="$(git show "$BEFORE_SHA:$old_config_path" 2>/dev/null)"; then
                echo "::warning::La carpeta $project desapareció, pero no se pudo recuperar su .clasp.json anterior. No se eliminará ni renombrará ningún proyecto de Google."
                continue
              fi

              old_script_id="$(printf '%s' "$old_config" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("scriptId", ""))' 2>/dev/null || true)"
              if [ -z "$old_script_id" ]; then
                echo "::warning::No se pudo obtener el scriptId anterior de $project. No se eliminará ni renombrará ningún proyecto de Google."
                continue
              fi

              matching_projects="$RUNNER_TEMP/matching-$project.txt"
              : > "$matching_projects"

              while IFS= read -r current_config; do
                current_script_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("scriptId", ""))' "$current_config" 2>/dev/null || true)"
                if [ "$current_script_id" = "$old_script_id" ]; then
                  basename "$(dirname "$current_config")" >> "$matching_projects"
                fi
              done < <(find natura/apps-script -mindepth 2 -maxdepth 2 -type f -name .clasp.json -print)

              match_count="$(wc -l < "$matching_projects" | tr -d ' ')"

              if [ "$match_count" -eq 0 ]; then
                printf '%s\n' "$project" >> "$deleted_projects_file"
                echo "Proyecto eliminado del repositorio y marcado para eliminar también de Google Apps Script: $project"
                continue
              fi

              if [ "$match_count" -eq 1 ]; then
                current_project="$(head -n 1 "$matching_projects")"
                if [ "$current_project" != "$project" ] && grep -Fxq "$current_project" "$changed_projects"; then
                  printf '%s\t%s\t%s\n' "$project" "$current_project" "$old_script_id" >> "$renamed_projects_file"
                  echo "Proyecto renombrado: $project -> $current_project. El nombre se sincronizará también en Google Apps Script."
                else
                  echo "El script de $project sigue registrado en $current_project; no se elimina de Google."
                fi
              else
                echo "::warning::El scriptId de $project aparece en varias carpetas actuales. No se renombrará ni eliminará el proyecto de Google automáticamente."
              fi
            done < "$disappeared_projects"

            sort -u -o "$projects_file" "$projects_file"
            sort -u -o "$renamed_projects_file" "$renamed_projects_file"
            sort -u -o "$deleted_projects_file" "$deleted_projects_file"
          fi

          if [ -s "$projects_file" ]; then
            echo "has_projects=true" >> "$GITHUB_OUTPUT"
            echo "Proyectos que se publicarán:"
            sed 's/^/- /' "$projects_file"
          else
            echo "has_projects=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -s "$renamed_projects_file" ]; then
            echo "has_renamed_projects=true" >> "$GITHUB_OUTPUT"
            echo "Proyectos cuyo nombre se sincronizará en Google Apps Script:"
            awk -F '\t' '{print "- " $1 " -> " $2}' "$renamed_projects_file"
          else
            echo "has_renamed_projects=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -s "$deleted_projects_file" ]; then
            echo "has_deleted_projects=true" >> "$GITHUB_OUTPUT"
            echo "Proyectos que se eliminarán de Google Apps Script:"
            sed 's/^/- /' "$deleted_projects_file"
          else
            echo "has_deleted_projects=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -s "$projects_file" ] || [ -s "$renamed_projects_file" ] || [ -s "$deleted_projects_file" ]; then
            echo "has_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "No hay proyectos que publicar, renombrar o eliminar en Google Apps Script."
          fi

      - name: Preparar Node.js
        if: steps.projects.outputs.has_work == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar clasp
        if: steps.projects.outputs.has_work == 'true'
        run: npm install --global @google/clasp@3.4.1

      - name: Restaurar autorización de Google
        if: steps.projects.outputs.has_work == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Falta el secreto CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          chmod 600 "$RUNNER_TEMP/.clasprc.json"

      - name: Sincronizar nombres de proyectos en Google Apps Script
        if: steps.projects.outputs.has_renamed_projects == 'true'
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          # Fuerza una llamada autenticada para que clasp renueve el access token si fuera necesario.
          clasp list-scripts >/dev/null

          access_token="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); c=((d.get("tokens") or {}).get("default") or d.get("token") or d); print(c.get("access_token", ""))' "$RUNNER_TEMP/.clasprc.json" 2>/dev/null || true)"
          if [ -z "$access_token" ]; then
            echo "::error::No se pudo obtener un access token renovado desde la autorización de clasp."
            exit 1
          fi

          while IFS=$'\t' read -r old_project new_project script_id; do
            [ -n "$new_project" ] || continue
            metadata_file="$RUNNER_TEMP/drive-metadata-$new_project.json"
            response_file="$RUNNER_TEMP/drive-rename-$new_project.json"

            status="$(curl --silent --show-error --output "$metadata_file" --write-out '%{http_code}' \
              --header "Authorization: Bearer $access_token" \
              "https://www.googleapis.com/drive/v3/files/$script_id?fields=id,name,mimeType&supportsAllDrives=true")"

            if [ "$status" != "200" ]; then
              echo "::error::No se pudo verificar en Google Drive el proyecto $new_project (HTTP $status)."
              cat "$metadata_file"
              exit 1
            fi

            mime_type="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("mimeType", ""))' "$metadata_file")"
            current_name="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("name", ""))' "$metadata_file")"

            if [ "$mime_type" != "application/vnd.google-apps.script" ]; then
              echo "::error::El scriptId de $new_project no corresponde a un archivo independiente de Google Apps Script. No se cambiará ningún nombre."
              exit 1
            fi

            if [ "$current_name" = "$new_project" ]; then
              echo "El proyecto de Google ya se llama $new_project."
              continue
            fi

            payload="$(python3 -c 'import json,sys; print(json.dumps({"name": sys.argv[1]}, ensure_ascii=False))' "$new_project")"
            status="$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' \
              --request PATCH \
              --header "Authorization: Bearer $access_token" \
              --header "Content-Type: application/json; charset=UTF-8" \
              --data "$payload" \
              "https://www.googleapis.com/drive/v3/files/$script_id?fields=id,name,mimeType&supportsAllDrives=true")"

            if [ "$status" != "200" ]; then
              echo "::error::No se pudo cambiar el nombre de $old_project a $new_project en Google Apps Script (HTTP $status)."
              cat "$response_file"
              exit 1
            fi

            confirmed_name="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("name", ""))' "$response_file")"
            if [ "$confirmed_name" != "$new_project" ]; then
              echo "::error::Google no confirmó el nombre esperado para $new_project."
              exit 1
            fi

            echo "Nombre actualizado en Google Apps Script: $old_project -> $new_project"
          done < "$RUNNER_TEMP/renamed-projects.txt"

      - name: Eliminar de Google Apps Script los proyectos borrados
        if: steps.projects.outputs.has_deleted_projects == 'true'
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          while IFS= read -r project; do
            [ -n "$project" ] || continue
            old_config_path="natura/apps-script/$project/.clasp.json"
            temp_dir="$RUNNER_TEMP/delete-$project"
            mkdir -p "$temp_dir"

            if ! git show "$BEFORE_SHA:$old_config_path" > "$temp_dir/.clasp.json"; then
              echo "::error::No se pudo recuperar la configuración anterior de $project. No se eliminará nada de Google."
              exit 1
            fi

            script_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("scriptId", ""))' "$temp_dir/.clasp.json" 2>/dev/null || true)"
            if [ -z "$script_id" ]; then
              echo "::error::La configuración anterior de $project no contiene un scriptId válido."
              exit 1
            fi

            echo "Eliminando de Google Apps Script el proyecto correspondiente a $project"
            (
              cd "$temp_dir"
              clasp delete-script --force
            )
          done < "$RUNNER_TEMP/deleted-projects.txt"

      - name: Validar, publicar y desplegar proyectos
        if: steps.projects.outputs.has_projects == 'true'
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          while IFS= read -r project; do
            project_dir="natura/apps-script/$project"

            if [ ! -f "$project_dir/.clasp.json" ]; then
              echo "::error::No existe la configuración de $project"
              exit 1
            fi
            if [ ! -f "$project_dir/appsscript.json" ]; then
              echo "::error::Primero sincroniza $project desde Google Apps Script"
              exit 1
            fi
            if ! find "$project_dir" -type f \( -name '*.js' -o -name '*.gs' -o -name '*.html' \) -print -quit | grep -q .; then
              echo "::error::$project no contiene código de Apps Script"
              exit 1
            fi

            echo "Publicando $project"
            (
              cd "$project_dir"
              clasp push

              mapfile -t deployment_ids < <(
                clasp deployments 2>/dev/null |
                  awk '/^- / && $3 != "@HEAD" {print $2}'
              )

              if [ "${#deployment_ids[@]}" -eq 0 ]; then
                echo "No existe una implementación versionada; creando una nueva"
                clasp deploy --description "GitHub ${GITHUB_SHA}"
              elif [ "${#deployment_ids[@]}" -eq 1 ]; then
                echo "Actualizando implementación ${deployment_ids[0]}"
                clasp deploy --deploymentId "${deployment_ids[0]}" --description "GitHub ${GITHUB_SHA}"
              else
                echo "::error::$project tiene varias implementaciones versionadas. No se actualizará ninguna automáticamente para evitar modificar la incorrecta."
                printf 'Implementaciones detectadas:\n'
                printf -- '- %s\n' "${deployment_ids[@]}"
                exit 1
              fi
            )
          done < "$RUNNER_TEMP/projects.txt"
