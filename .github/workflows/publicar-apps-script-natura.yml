name: Publicar e implementar Apps Script Natura manualmente

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/publicar-apps-script-natura.txt"

permissions:
  contents: read

concurrency:
  group: publicar-apps-script-natura-manual
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Localizar proyectos Natura de Git
        id: projects
        run: |
          projects_file="$RUNNER_TEMP/projects.tsv"
          : > "$projects_file"

          python3 - "$projects_file" <<'PY'
          import json
          import os
          import sys

          output_path = sys.argv[1]
          root = "natura/apps-script"
          projects = []

          for base, _, files in os.walk(root):
              if ".clasp.json" not in files:
                  continue
              rel = os.path.relpath(base, root).replace(os.sep, "/")
              if rel in (".", ""):
                  continue

              top_name = rel.split("/", 1)[0]
              if "natura" not in top_name.casefold():
                  continue

              config_path = os.path.join(base, ".clasp.json")
              with open(config_path, encoding="utf-8") as fh:
                  script_id = json.load(fh).get("scriptId", "")
              if not isinstance(script_id, str) or not script_id:
                  raise SystemExit(f"{config_path} no contiene un scriptId válido")

              projects.append((script_id, top_name, rel))

          seen = set()
          with open(output_path, "w", encoding="utf-8", newline="\n") as fh:
              for script_id, project_name, rel in sorted(projects, key=lambda x: (x[1].casefold(), x[2])):
                  if script_id in seen:
                      continue
                  seen.add(script_id)
                  fh.write(f"{script_id}\t{project_name}\t{rel}\n")

          print(f"Proyectos Natura disponibles para publicación manual: {len(seen)}")
          for _, name, rel in projects:
              print(f"- {name}: {rel}")
          PY

          if [ -s "$projects_file" ]; then
            echo "has_projects=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_projects=false" >> "$GITHUB_OUTPUT"
            echo "No hay proyectos Natura que publicar."
          fi

      - name: Preparar Node.js
        if: steps.projects.outputs.has_projects == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar clasp
        if: steps.projects.outputs.has_projects == 'true'
        run: npm install --global @google/clasp@3.4.1

      - name: Restaurar autorización de Google
        if: steps.projects.outputs.has_projects == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Falta el secreto CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          chmod 600 "$RUNNER_TEMP/.clasprc.json"

      - name: Validar proyectos y sincronizar nombres en Google
        if: steps.projects.outputs.has_projects == 'true'
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          clasp list-scripts >/dev/null

          python3 - \
            "$RUNNER_TEMP/.clasprc.json" \
            "$RUNNER_TEMP/projects.tsv" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          auth_path, projects_path = sys.argv[1:3]
          with open(auth_path, encoding="utf-8") as fh:
              auth = json.load(fh)
          credentials = ((auth.get("tokens") or {}).get("default") or auth.get("token") or auth)
          token = credentials.get("access_token", "") if isinstance(credentials, dict) else ""
          if not token:
              raise SystemExit("No se pudo obtener el access_token actualizado de clasp")

          headers = {"Authorization": f"Bearer {token}"}

          with open(projects_path, encoding="utf-8") as fh:
              rows = [line.rstrip("\n").split("\t", 2) for line in fh if line.strip()]

          for script_id, project_name, _ in rows:
              encoded = urllib.parse.quote(script_id, safe="")
              url = (
                  f"https://www.googleapis.com/drive/v3/files/{encoded}"
                  "?fields=id,name,mimeType,trashed&supportsAllDrives=true"
              )
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      metadata = json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"No se pudo consultar {project_name} en Google: HTTP {error.code}: {body}")

              if metadata.get("mimeType") != "application/vnd.google-apps.script":
                  raise SystemExit(f"{project_name} no corresponde a un proyecto Apps Script")
              if metadata.get("trashed") is True:
                  raise SystemExit(f"{project_name} está en la papelera de Google. No se modificará ni restaurará automáticamente.")

              if metadata.get("name") != project_name:
                  payload = json.dumps({"name": project_name}).encode("utf-8")
                  patch = urllib.request.Request(
                      url,
                      data=payload,
                      headers={**headers, "Content-Type": "application/json"},
                      method="PATCH",
                  )
                  try:
                      with urllib.request.urlopen(patch, timeout=30) as response:
                          updated = json.load(response)
                  except urllib.error.HTTPError as error:
                      body = error.read().decode("utf-8", errors="replace")
                      raise SystemExit(f"No se pudo renombrar {project_name} en Google: HTTP {error.code}: {body}")

                  if updated.get("name") != project_name:
                      raise SystemExit(f"Google no confirmó el nombre esperado para {project_name}")
                  print(f"Nombre sincronizado en Google: {project_name}")
          PY

      - name: Publicar código y actualizar implementación
        if: steps.projects.outputs.has_projects == 'true'
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          repo_root="$(git rev-parse --show-toplevel)"

          while IFS=$'\t' read -r script_id project_name git_path; do
            [ -n "$script_id" ] || continue
            project_dir="natura/apps-script/$git_path"

            if [ ! -f "$project_dir/.clasp.json" ]; then
              echo "::error::Falta .clasp.json en $project_name"
              exit 1
            fi
            if [ ! -f "$project_dir/appsscript.json" ]; then
              echo "::error::Falta appsscript.json en $project_name"
              exit 1
            fi

            actual_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("scriptId", ""))' "$project_dir/.clasp.json")"
            if [ "$actual_id" != "$script_id" ]; then
              echo "::error::El scriptId de $project_name no coincide con el detectado."
              exit 1
            fi

            echo "Publicando en Google Apps Script: $project_name"
            (
              cd "$project_dir"
              push_output="$(clasp push --force 2>&1)"
              printf '%s\n' "$push_output"

              if printf '%s\n' "$push_output" | grep -Fq "Script is already up to date."; then
                echo "El código ya coincide con Google; no se crea una versión innecesaria."
                exit 0
              fi

              mapfile -t deployment_ids < <(
                clasp deployments 2>/dev/null |
                  awk '/^- / && $3 != "@HEAD" {print $2}'
              )

              if [ "${#deployment_ids[@]}" -eq 0 ]; then
                echo "Creando primera implementación versionada"
                clasp deploy --description "GitHub ${GITHUB_SHA}"
              elif [ "${#deployment_ids[@]}" -eq 1 ]; then
                echo "Actualizando única implementación ${deployment_ids[0]}"
                clasp deploy --deploymentId "${deployment_ids[0]}" --description "GitHub ${GITHUB_SHA}"
              else
                referenced_ids=()
                for deployment_id in "${deployment_ids[@]}"; do
                  if grep -R -F -q \
                    --exclude-dir=.git \
                    --exclude-dir=.github \
                    --exclude-dir=apps-script \
                    --exclude-dir=apps-script-excluidos \
                    -- "$deployment_id" "$repo_root/natura"; then
                    referenced_ids+=("$deployment_id")
                  fi
                done

                if [ "${#referenced_ids[@]}" -eq 1 ]; then
                  echo "Varias implementaciones detectadas; actualizando la usada por el proyecto: ${referenced_ids[0]}"
                  clasp deploy --deploymentId "${referenced_ids[0]}" --description "GitHub ${GITHUB_SHA}"
                else
                  echo "::error::$project_name tiene ${#deployment_ids[@]} implementaciones versionadas y no se pudo identificar de forma inequívoca cuál usa el sitio."
                  printf 'Implementaciones detectadas:\n'
                  printf -- '- %s\n' "${deployment_ids[@]}"
                  printf 'Implementaciones referenciadas por el sitio: %s\n' "${#referenced_ids[@]}"
                  exit 1
                fi
              fi
            )
          done < "$RUNNER_TEMP/projects.tsv"

          echo "Publicación manual terminada. No se eliminó ningún proyecto de Google."
