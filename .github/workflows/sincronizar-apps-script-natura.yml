name: Verificar Apps Script de Natura

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verificar-apps-script-natura
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restaurar autorización de Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Falta el secreto CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          chmod 600 "$RUNNER_TEMP/.clasprc.json"

      - name: Verificar proyectos registrados sin modificar GitHub
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          found=false
          while IFS= read -r -d '' config; do
            found=true
            project_dir="$(dirname "$config")"
            project="$(basename "$project_dir")"
            echo "Verificando $project"
            (
              cd "$project_dir"
              clasp deployments >/dev/null
            )
          done < <(find natura/apps-script -mindepth 2 -maxdepth 2 -type f -name .clasp.json -print0)

          if [ "$found" = false ]; then
            echo "::error::No se encontraron proyectos de Apps Script registrados."
            exit 1
          fi

          echo "Verificación completada. No se importó ni modificó ningún archivo desde Google."
