name: Sincronizar Apps Script de Natura

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sincronizar-apps-script-natura
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restaurar autorización de Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Falta el secreto CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          chmod 600 "$RUNNER_TEMP/.clasprc.json"

      - name: Descargar proyectos registrados
        env:
          CLASP_CONFIG_AUTH: ${{ runner.temp }}/.clasprc.json
        run: |
          while IFS= read -r -d '' config; do
            project_dir="$(dirname "$config")"
            echo "Sincronizando $project_dir"
            (
              cd "$project_dir"
              clasp pull
            )
          done < <(find natura/apps-script -mindepth 2 -maxdepth 2 -name .clasp.json -print0)

      - name: Guardar únicamente cambios de Apps Script
        run: |
          git add natura/apps-script
          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sincronizar Apps Script de Natura"
          git push
