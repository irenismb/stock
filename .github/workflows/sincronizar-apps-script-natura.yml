name: Traer Apps Script Natura desde Google

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/triggers/traer-apps-script-natura.txt"

permissions:
  contents: write

concurrency:
  group: traer-apps-script-natura-desde-google
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restaurar autorización de Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Falta el secreto CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          chmod 600 "$RUNNER_TEMP/.clasprc.json"

      - name: Verificar proyectos oficiales de Natura
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          # Refresca la autorización de clasp sin usar su listado como fuente de verdad.
          clasp list-scripts >/dev/null

          python3 - \
            "$RUNNER_TEMP/.clasprc.json" \
            "$RUNNER_TEMP/google-projects.tsv" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          auth_path, output_path = sys.argv[1:3]

          projects = [
              {
                  "scriptId": "1-wBaemhULEFETfQHJDocPTOjbXnVds27DZfiIU9sMnCYf01qSycs1jc4",
                  "name": "administrar precios natura",
                  "gitPath": "administrar precios natura",
              },
              {
                  "scriptId": "12M9b5tq5xV0tqMxoJgJgjPKaOE8Q9PQj5TfyzhFEBtNcJHOijKkByEwt",
                  "name": "pedidos natura",
                  "gitPath": "pedidos natura",
              },
              {
                  "scriptId": "1wN8Cyp7JmJOtIY0etPKyo_3r5y48MYpMrT5PFQeVmoyztPwYO53sWfLf",
                  "name": "lectura de carpetas en natura",
                  "gitPath": "lectura de carpetas en natura",
              },
              {
                  "scriptId": "1T2y1xSKlZueX-SYDU9HxFi6K4ShLbiHRUGY21caNtSv9Gz-6h1aLd5ZN",
                  "name": "coordenadas de visitantes natura",
                  "gitPath": "coordenadas de visitantes natura",
              },
          ]

          with open(auth_path, encoding="utf-8") as fh:
              auth = json.load(fh)
          credentials = ((auth.get("tokens") or {}).get("default") or auth.get("token") or auth)
          token = credentials.get("access_token", "") if isinstance(credentials, dict) else ""
          if not token:
              raise SystemExit("No se pudo obtener el access_token actualizado de clasp")

          headers = {"Authorization": f"Bearer {token}"}

          for item in projects:
              script_id = item["scriptId"]
              encoded = urllib.parse.quote(script_id, safe="")
              url = (
                  f"https://www.googleapis.com/drive/v3/files/{encoded}"
                  "?fields=id,name,mimeType,trashed&supportsAllDrives=true"
              )
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      metadata = json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(
                      f"No se pudo verificar {item['name']} [{script_id}]: "
                      f"HTTP {error.code}: {body}"
                  )

              if metadata.get("mimeType") != "application/vnd.google-apps.script":
                  raise SystemExit(f"{item['name']} no corresponde a un proyecto Apps Script")
              if metadata.get("trashed") is True:
                  raise SystemExit(f"{item['name']} está en la papelera")
              if str(metadata.get("name") or "").strip() != item["name"]:
                  raise SystemExit(
                      f"Nombre inesperado para {script_id}: "
                      f"{metadata.get('name')!r}; esperado {item['name']!r}"
                  )

          with open(output_path, "w", encoding="utf-8", newline="\n") as fh:
              for item in projects:
                  fh.write(
                      f'{item["scriptId"]}\t{item["name"]}\t{item["gitPath"]}\n'
                  )

          with open(
              "natura/apps-script/google-projects.json",
              "w",
              encoding="utf-8",
              newline="\n",
          ) as fh:
              json.dump(
                  {
                      "source": "Google Apps Script",
                      "selection": "explicit production allowlist",
                      "projects": projects,
                  },
                  fh,
                  ensure_ascii=False,
                  indent=2,
              )
              fh.write("\n")

          print("Proyectos oficiales Natura verificados:")
          for item in projects:
              print(f'- {item["name"]} [{item["scriptId"]}]')
          PY

      - name: Validar que la carpeta activa solo contenga proyectos oficiales
        run: |
          python3 - "$RUNNER_TEMP/google-projects.tsv" <<'PY'
          import json
          import os
          import sys

          selected_path = sys.argv[1]
          root = "natura/apps-script"

          selected_ids = set()
          with open(selected_path, encoding="utf-8") as fh:
              for line in fh:
                  if line.strip():
                      selected_ids.add(line.split("\t", 1)[0])

          conflicts = []
          for base, _, files in os.walk(root):
              if ".clasp.json" not in files:
                  continue
              config_path = os.path.join(base, ".clasp.json")
              try:
                  with open(config_path, encoding="utf-8") as fh:
                      script_id = json.load(fh).get("scriptId", "")
              except Exception as exc:
                  raise SystemExit(f"No se pudo leer {config_path}: {exc}")
              if script_id and script_id not in selected_ids:
                  conflicts.append((base, script_id))

          if conflicts:
              print("::error::Hay proyectos no oficiales dentro de natura/apps-script.")
              for path, script_id in conflicts:
                  print(f"- {path} [{script_id}]")
              raise SystemExit(
                  "Se detuvo sin mover ni borrar nada. Corrige la carpeta activa antes de sincronizar."
              )
          PY

      - name: Traer código desde Google
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          while IFS=$'\t' read -r script_id remote_name git_path; do
            [ -n "$script_id" ] || continue
            target_dir="natura/apps-script/$git_path"
            found=""

            while IFS= read -r -d '' config; do
              current_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("scriptId", ""))' "$config" 2>/dev/null || true)"
              if [ "$current_id" = "$script_id" ]; then
                found="$(dirname "$config")"
                break
              fi
            done < <(find natura/apps-script -type f -name .clasp.json -print0)

            if [ -n "$found" ] && [ "$found" != "$target_dir" ]; then
              if [ -e "$target_dir" ]; then
                echo "::error::No se puede renombrar $found a $target_dir porque el destino ya existe."
                exit 1
              fi
              mkdir -p "$(dirname "$target_dir")"
              mv "$found" "$target_dir"
            elif [ -z "$found" ]; then
              if [ -e "$target_dir" ]; then
                echo "::error::Existe $target_dir pero no corresponde al scriptId $script_id."
                exit 1
              fi
              mkdir -p "$target_dir"
              printf '{\n  "scriptId": "%s",\n  "rootDir": "."\n}\n' "$script_id" > "$target_dir/.clasp.json"
            fi

            echo "Trayendo desde Google: $remote_name"
            (
              cd "$target_dir"
              clasp pull --deleteUnusedFiles --force
            )
          done < "$RUNNER_TEMP/google-projects.tsv"

      - name: Guardar en GitHub lo traído desde Google
        run: |
          git add -A natura/apps-script
          if git diff --cached --quiet; then
            echo "GitHub ya coincide con los Apps Script oficiales de Google."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Traer Apps Script Natura desde Google"
          git push origin HEAD:main
