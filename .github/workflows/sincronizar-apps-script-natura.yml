name: Sincronizar Apps Script desde Google

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sincronizar-apps-script-desde-google
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restaurar autorización de Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Falta el secreto CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          chmod 600 "$RUNNER_TEMP/.clasprc.json"

      - name: Leer proyectos de Google Apps Script
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          if [ ! -f "natura/apps-script/google-projects.json" ]; then
            echo "::error::Falta natura/apps-script/google-projects.json"
            exit 1
          fi

          clasp list-scripts --json > "$RUNNER_TEMP/google-scripts.json"
          python3 - "$RUNNER_TEMP/google-scripts.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          if not isinstance(data, list):
              raise SystemExit("La respuesta de clasp list-scripts no es una lista JSON válida")
          PY

      - name: Sincronizar nombres y código desde Google
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          registry="natura/apps-script/google-projects.json"
          scripts_json="$RUNNER_TEMP/google-scripts.json"

          mapfile -t script_ids < <(
            python3 - "$registry" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          for script_id in data.get("scriptIds", []):
              if script_id:
                  print(script_id)
          PY
          )

          if [ "${#script_ids[@]}" -eq 0 ]; then
            echo "::error::No hay scriptIds registrados."
            exit 1
          fi

          for script_id in "${script_ids[@]}"; do
            remote_name="$(python3 - "$scripts_json" "$script_id" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              scripts = json.load(fh)
          script_id = sys.argv[2]
          for item in scripts:
              if item.get("id") == script_id:
                  print(item.get("name", ""))
                  break
          PY
          )"

            if [ -z "$remote_name" ]; then
              echo "::warning::El proyecto $script_id no aparece accesible en Google. No se borrará ni moverá nada del repositorio."
              continue
            fi

            if ! python3 - "$remote_name" <<'PY'
          import sys
          name = sys.argv[1]
          invalid_chars = '<>:"/\\|?*'
          reserved = {"CON", "PRN", "AUX", "NUL"}
          reserved.update({f"COM{i}" for i in range(1, 10)})
          reserved.update({f"LPT{i}" for i in range(1, 10)})
          ok = bool(name) and name not in {".", ".."}
          ok = ok and not any(ord(ch) < 32 for ch in name)
          ok = ok and not any(ch in invalid_chars for ch in name)
          ok = ok and not name.endswith((" ", "."))
          ok = ok and name.split(".", 1)[0].upper() not in reserved
          raise SystemExit(0 if ok else 1)
          PY
            then
              echo "::error::El nombre de Google '$remote_name' no es válido como carpeta de Windows."
              exit 1
            fi

            matches_file="$RUNNER_TEMP/matches-$script_id.txt"
            : > "$matches_file"
            while IFS= read -r -d '' config; do
              current_id="$(python3 - "$config" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  print(json.load(fh).get("scriptId", ""))
          except Exception:
              print("")
          PY
          )"
              if [ "$current_id" = "$script_id" ]; then
                dirname "$config" >> "$matches_file"
              fi
            done < <(find natura/apps-script -mindepth 2 -maxdepth 2 -type f -name .clasp.json -print0)

            match_count="$(wc -l < "$matches_file" | tr -d ' ')"
            if [ "$match_count" -gt 1 ]; then
              echo "::error::El scriptId $script_id aparece en varias carpetas del repositorio."
              cat "$matches_file"
              exit 1
            fi

            target_dir="natura/apps-script/$remote_name"

            if [ "$match_count" -eq 1 ]; then
              current_dir="$(head -n 1 "$matches_file")"
              if [ "$current_dir" != "$target_dir" ]; then
                if [ -e "$target_dir" ]; then
                  echo "::error::Google quiere renombrar $(basename "$current_dir") a $remote_name, pero $target_dir ya existe."
                  exit 1
                fi
                echo "Google manda: renombrando $(basename "$current_dir") -> $remote_name"
                git mv "$current_dir" "$target_dir"
              fi
            else
              if [ -e "$target_dir" ] && [ -f "$target_dir/.clasp.json" ]; then
                existing_id="$(python3 - "$target_dir/.clasp.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              print(json.load(fh).get("scriptId", ""))
          PY
          )"
                if [ "$existing_id" != "$script_id" ]; then
                  echo "::error::$target_dir pertenece a otro scriptId."
                  exit 1
                fi
              else
                mkdir -p "$target_dir"
                printf '{\n  "scriptId": "%s",\n  "rootDir": "."\n}\n' "$script_id" > "$target_dir/.clasp.json"
                echo "Restaurando en GitHub el proyecto de Google: $remote_name"
              fi
            fi

            echo "Descargando desde Google Apps Script: $remote_name"
            (
              cd "$target_dir"
              clasp pull
            )
          done

      - name: Guardar cambios recibidos desde Google
        run: |
          git add -A natura/apps-script
          if git diff --cached --quiet; then
            echo "Google y GitHub ya están sincronizados."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sincronizar Apps Script desde Google"
          git pull --rebase origin main
          git push origin HEAD:main
