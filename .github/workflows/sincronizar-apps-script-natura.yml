name: Sincronizar todos los Apps Script desde Google

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches:
      - main
    paths:
      - "natura/apps-script/**"
      - ".github/workflows/sincronizar-apps-script-natura.yml"

permissions:
  contents: write

concurrency:
  group: sincronizar-apps-script-desde-google
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restaurar autorización de Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Falta el secreto CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          chmod 600 "$RUNNER_TEMP/.clasprc.json"

      - name: Inventariar todos los Apps Script activos conocidos y visibles
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          # clasp refresca las credenciales y aporta otra fuente de scriptId.
          clasp list-scripts --json > "$RUNNER_TEMP/clasp-scripts.json"

          python3 - \
            "$RUNNER_TEMP/.clasprc.json" \
            "$RUNNER_TEMP/clasp-scripts.json" \
            "natura/apps-script/google-projects.json" \
            "$RUNNER_TEMP/google-projects.tsv" \
            "$RUNNER_TEMP/trashed-script-ids.txt" <<'PY'
          import collections
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          auth_path, clasp_path, registry_path, tsv_path, trashed_path = sys.argv[1:6]

          with open(auth_path, encoding="utf-8") as fh:
              auth = json.load(fh)
          credentials = ((auth.get("tokens") or {}).get("default") or auth.get("token") or auth)
          access_token = credentials.get("access_token", "") if isinstance(credentials, dict) else ""
          if not access_token:
              raise SystemExit("No se pudo obtener el access_token actualizado de clasp")

          headers = {"Authorization": f"Bearer {access_token}"}

          def drive_list(trashed):
              result = []
              page_token = ""
              q = "mimeType = 'application/vnd.google-apps.script' and trashed = " + ("true" if trashed else "false")
              while True:
                  params = {
                      "q": q,
                      "spaces": "drive",
                      "corpora": "user",
                      "pageSize": "1000",
                      "fields": "nextPageToken,files(id,name,mimeType,trashed)",
                      "includeItemsFromAllDrives": "true",
                      "supportsAllDrives": "true",
                  }
                  if page_token:
                      params["pageToken"] = page_token
                  url = "https://www.googleapis.com/drive/v3/files?" + urllib.parse.urlencode(params)
                  request = urllib.request.Request(url, headers=headers)
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = json.load(response)
                  except urllib.error.HTTPError as error:
                      body = error.read().decode("utf-8", errors="replace")
                      raise SystemExit(f"No se pudo listar Apps Script en Drive: HTTP {error.code}: {body}")
                  result.extend(payload.get("files") or [])
                  page_token = payload.get("nextPageToken") or ""
                  if not page_token:
                      return result

          def get_metadata(script_id):
              encoded = urllib.parse.quote(script_id, safe="")
              url = (
                  f"https://www.googleapis.com/drive/v3/files/{encoded}"
                  "?fields=id,name,mimeType,trashed&supportsAllDrives=true"
              )
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code in (403, 404):
                      print(f"AVISO: no se pudo consultar el scriptId conocido {script_id}: HTTP {error.code}")
                      return None
                  body = error.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"No se pudo consultar {script_id}: HTTP {error.code}: {body}")

          candidate_ids = set()

          # 1) Lo que clasp puede enumerar.
          with open(clasp_path, encoding="utf-8") as fh:
              clasp_items = json.load(fh)
          if isinstance(clasp_items, list):
              for item in clasp_items:
                  script_id = item.get("id", "") if isinstance(item, dict) else ""
                  if isinstance(script_id, str) and script_id:
                      candidate_ids.add(script_id)

          # 2) Todo lo que Drive puede enumerar, activo o en papelera.
          drive_active = drive_list(False)
          drive_trashed = drive_list(True)
          for item in drive_active + drive_trashed:
              script_id = item.get("id", "") if isinstance(item, dict) else ""
              if isinstance(script_id, str) and script_id:
                  candidate_ids.add(script_id)

          # 3) Todos los scriptId que Git ya conoce, incluso los apartados.
          for root in ("natura/apps-script", "natura/apps-script-excluidos"):
              if not os.path.isdir(root):
                  continue
              for base, _, files in os.walk(root):
                  if ".clasp.json" not in files:
                      continue
                  path = os.path.join(base, ".clasp.json")
                  try:
                      with open(path, encoding="utf-8") as fh:
                          script_id = json.load(fh).get("scriptId", "")
                  except Exception:
                      continue
                  if isinstance(script_id, str) and script_id:
                      candidate_ids.add(script_id)

          invalid_chars = '<>:"/\\|?*'
          reserved = {"CON", "PRN", "AUX", "NUL"}
          reserved.update({f"COM{i}" for i in range(1, 10)})
          reserved.update({f"LPT{i}" for i in range(1, 10)})

          active = []
          trashed_ids = []
          for script_id in sorted(candidate_ids):
              metadata = get_metadata(script_id)
              if not metadata:
                  continue
              if metadata.get("mimeType") != "application/vnd.google-apps.script":
                  continue
              if metadata.get("trashed") is True:
                  trashed_ids.append(script_id)
                  continue

              name = metadata.get("name", "")
              if not isinstance(name, str) or not name:
                  raise SystemExit(f"Google devolvió un nombre vacío para {script_id}")
              valid = name not in {".", ".."}
              valid = valid and not any(ord(ch) < 32 for ch in name)
              valid = valid and not any(ch in invalid_chars for ch in name)
              valid = valid and not name.endswith((" ", "."))
              valid = valid and name.split(".", 1)[0].upper() not in reserved
              if not valid:
                  raise SystemExit(f"El nombre de Google '{name}' no puede usarse exactamente como carpeta en Windows")
              active.append({"scriptId": script_id, "name": name})

          if not active:
              raise SystemExit("No se encontró ningún Apps Script activo accesible")

          counts = collections.Counter(item["name"].casefold() for item in active)
          active.sort(key=lambda x: (x["name"].casefold(), x["scriptId"]))
          for item in active:
              duplicate = counts[item["name"].casefold()] > 1
              item["duplicateName"] = duplicate
              item["gitPath"] = f'{item["name"]}/{item["scriptId"]}' if duplicate else item["name"]

          registry = {
              "source": "Google Drive / Apps Script + scriptId conocidos",
              "filter": "trashed=false",
              "scriptIds": [item["scriptId"] for item in active],
              "projects": active,
          }
          with open(registry_path, "w", encoding="utf-8", newline="\n") as fh:
              json.dump(registry, fh, ensure_ascii=False, indent=2)
              fh.write("\n")

          with open(tsv_path, "w", encoding="utf-8", newline="\n") as fh:
              for item in active:
                  fh.write(f'{item["scriptId"]}\t{item["name"]}\t{item["gitPath"]}\n')

          with open(trashed_path, "w", encoding="utf-8", newline="\n") as fh:
              for script_id in sorted(set(trashed_ids)):
                  fh.write(script_id + "\n")

          print(f"scriptId candidatos comprobados: {len(candidate_ids)}")
          print(f"Proyectos activos accesibles: {len(active)}")
          print(f"Proyectos en papelera excluidos: {len(set(trashed_ids))}")
          for item in active:
              print(f"ACTIVO: {item['name']} [{item['scriptId']}]")
          PY

      - name: Apartar proyectos que no están activos en Google
        run: |
          active_ids="$RUNNER_TEMP/active-script-ids.txt"
          cut -f1 "$RUNNER_TEMP/google-projects.tsv" | sort -u > "$active_ids"
          trashed_ids="$RUNNER_TEMP/trashed-script-ids.txt"
          configs="$RUNNER_TEMP/local-configs.bin"
          find natura/apps-script -mindepth 2 -maxdepth 3 -type f -name .clasp.json -print0 > "$configs"

          while IFS= read -r -d '' config; do
            [ -e "$config" ] || continue
            local_id="$(python3 - "$config" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  print(json.load(fh).get("scriptId", ""))
          except Exception:
              print("")
          PY
          )"
            [ -n "$local_id" ] || continue
            grep -Fxq "$local_id" "$active_ids" && continue

            current_dir="$(dirname "$config")"
            if grep -Fxq "$local_id" "$trashed_ids"; then
              archive_root="natura/apps-script-excluidos/papelera-google"
              reason="papelera de Google"
            else
              archive_root="natura/apps-script-excluidos/no-activos-google"
              reason="fuera del inventario activo de Google"
            fi
            mkdir -p "$archive_root"
            target_dir="$archive_root/$local_id"
            if [ -e "$target_dir" ]; then
              target_dir="$archive_root/${local_id}-$(date +%Y%m%d%H%M%S)-$RANDOM"
            fi
            echo "Apartando de natura/apps-script $current_dir ($reason). No se modifica Google."
            mv "$current_dir" "$target_dir"
          done < "$configs"

      - name: Recuperar proyectos activos que estaban apartados
        run: |
          while IFS=$'\t' read -r script_id remote_name git_path; do
            [ -n "$script_id" ] || continue
            if find natura/apps-script -mindepth 2 -maxdepth 3 -type f -name .clasp.json -print0 | \
              xargs -0 -r grep -lF "\"$script_id\"" >/dev/null 2>&1; then
              continue
            fi

            found=""
            while IFS= read -r -d '' config; do
              current_id="$(python3 - "$config" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  print(json.load(fh).get("scriptId", ""))
          except Exception:
              print("")
          PY
          )"
              if [ "$current_id" = "$script_id" ]; then
                found="$(dirname "$config")"
                break
              fi
            done < <(find natura/apps-script-excluidos -type f -name .clasp.json -print0 2>/dev/null || true)

            if [ -n "$found" ]; then
              staging="$RUNNER_TEMP/recover-$script_id"
              echo "Google confirma que vuelve a estar activo: recuperando $remote_name"
              mv "$found" "$staging"
              target="natura/apps-script/$git_path"
              mkdir -p "$(dirname "$target")"
              if [ -e "$target" ]; then
                conflict_root="natura/apps-script-excluidos/conflictos-sync"
                mkdir -p "$conflict_root"
                mv "$target" "$conflict_root/${script_id}-$(date +%Y%m%d%H%M%S)-$RANDOM"
              fi
              mv "$staging" "$target"
            fi
          done < "$RUNNER_TEMP/google-projects.tsv"

      - name: Sincronizar nombres y contenido desde Google
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          while IFS=$'\t' read -r script_id remote_name git_path; do
            [ -n "$script_id" ] || continue
            target_dir="natura/apps-script/$git_path"
            matches_file="$RUNNER_TEMP/matches-$script_id.txt"
            : > "$matches_file"

            while IFS= read -r -d '' config; do
              current_id="$(python3 - "$config" <<'PY'
          import json
          import sys
          try:
              with open(sys.argv[1], encoding="utf-8") as fh:
                  print(json.load(fh).get("scriptId", ""))
          except Exception:
              print("")
          PY
          )"
              if [ "$current_id" = "$script_id" ]; then
                dirname "$config" >> "$matches_file"
              fi
            done < <(find natura/apps-script -mindepth 2 -maxdepth 3 -type f -name .clasp.json -print0)

            match_count="$(wc -l < "$matches_file" | tr -d ' ')"
            if [ "$match_count" -gt 1 ]; then
              echo "::error::El scriptId $script_id aparece en varias carpetas activas de GitHub."
              cat "$matches_file"
              exit 1
            fi

            if [ "$match_count" -eq 1 ]; then
              current_dir="$(head -n 1 "$matches_file")"
              if [ "$current_dir" != "$target_dir" ]; then
                staging_dir="$RUNNER_TEMP/google-sync-$script_id"
                if [[ "$target_dir" == "$current_dir/"* ]]; then
                  echo "Google manda: agrupando $current_dir -> $git_path"
                  mv "$current_dir" "$staging_dir"
                  mkdir -p "$(dirname "$target_dir")"
                  mv "$staging_dir" "$target_dir"
                elif [[ "$current_dir" == "$target_dir/"* ]]; then
                  echo "Google manda: desagrupando $current_dir -> $git_path"
                  mv "$current_dir" "$staging_dir"
                  if ! rmdir "$target_dir" 2>/dev/null; then
                    conflict_root="natura/apps-script-excluidos/conflictos-sync"
                    mkdir -p "$conflict_root"
                    mv "$target_dir" "$conflict_root/${script_id}-$(date +%Y%m%d%H%M%S)-$RANDOM"
                  fi
                  mkdir -p "$(dirname "$target_dir")"
                  mv "$staging_dir" "$target_dir"
                else
                  if [ -e "$target_dir" ]; then
                    conflict_root="natura/apps-script-excluidos/conflictos-sync"
                    mkdir -p "$conflict_root"
                    mv "$target_dir" "$conflict_root/${script_id}-$(date +%Y%m%d%H%M%S)-$RANDOM"
                  fi
                  mkdir -p "$(dirname "$target_dir")"
                  echo "Google manda: moviendo $current_dir -> $git_path"
                  mv "$current_dir" "$target_dir"
                fi
              fi
            else
              if [ -e "$target_dir" ]; then
                conflict_root="natura/apps-script-excluidos/conflictos-sync"
                mkdir -p "$conflict_root"
                mv "$target_dir" "$conflict_root/${script_id}-$(date +%Y%m%d%H%M%S)-$RANDOM"
              fi
              mkdir -p "$target_dir"
              printf '{\n  "scriptId": "%s",\n  "rootDir": "."\n}\n' "$script_id" > "$target_dir/.clasp.json"
              echo "Google manda: creando en GitHub $git_path"
            fi

            echo "Copiando desde Google Apps Script: $remote_name [$script_id]"
            (
              cd "$target_dir"
              clasp pull --deleteUnusedFiles --force
            )
          done < "$RUNNER_TEMP/google-projects.tsv"

      - name: Guardar en GitHub la copia recibida desde Google
        run: |
          git add -A natura/apps-script
          if [ -d natura/apps-script-excluidos ]; then
            git add -A natura/apps-script-excluidos
          fi

          if git diff --cached --quiet; then
            echo "Google y GitHub ya están sincronizados para los proyectos activos."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sincronizar Apps Script activos desde Google"

          if ! git push origin HEAD:main; then
            echo "::warning::main cambió durante la sincronización. No se forzará el push; la siguiente ejecución volverá a copiar Google sobre el estado más reciente."
            exit 0
          fi
