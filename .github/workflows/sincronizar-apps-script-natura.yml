name: Sincronizar Apps Script de Natura

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sincronizar-apps-script-natura
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restaurar autorización de Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Falta el secreto CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          chmod 600 "$RUNNER_TEMP/.clasprc.json"

      - name: Sincronizar nombres desde Google Apps Script
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          # Esta llamada autenticada también renueva el access token cuando hace falta.
          clasp list-scripts >/dev/null

          access_token="$(python3 - "$RUNNER_TEMP/.clasprc.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)

          credentials = None
          tokens = data.get("tokens")
          if isinstance(tokens, dict):
              credentials = tokens.get("default")
          if not credentials and isinstance(data.get("token"), dict):
              credentials = data["token"]
          if not credentials:
              credentials = data

          print(credentials.get("access_token", "") if isinstance(credentials, dict) else "")
          PY
          )"

          if [ -z "$access_token" ]; then
            echo "::error::No se pudo obtener un access token válido desde la autorización de clasp."
            exit 1
          fi

          mapfile -d '' configs < <(find natura/apps-script -mindepth 2 -maxdepth 2 -type f -name .clasp.json -print0)

          for config in "${configs[@]}"; do
            project_dir="$(dirname "$config")"
            local_name="$(basename "$project_dir")"
            script_id="$(python3 - "$config" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              print(json.load(fh).get("scriptId", ""))
          PY
          )"

            if [ -z "$script_id" ]; then
              echo "::warning::$config no contiene scriptId. Se omite."
              continue
            fi

            metadata_file="$RUNNER_TEMP/metadata-$script_id.json"
            status="$(curl --silent --show-error --output "$metadata_file" --write-out '%{http_code}' \
              --header "Authorization: Bearer $access_token" \
              "https://www.googleapis.com/drive/v3/files/$script_id?fields=id,name,mimeType&supportsAllDrives=true")"

            if [ "$status" != "200" ]; then
              echo "::error::No se pudo consultar en Google el proyecto $local_name (HTTP $status)."
              cat "$metadata_file"
              exit 1
            fi

            readarray -t metadata < <(python3 - "$metadata_file" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              data = json.load(fh)
          print(data.get("name", ""))
          print(data.get("mimeType", ""))
          PY
          )

            remote_name="${metadata[0]:-}"
            mime_type="${metadata[1]:-}"

            if [ "$mime_type" != "application/vnd.google-apps.script" ]; then
              echo "::error::$script_id no corresponde a un proyecto independiente de Google Apps Script."
              exit 1
            fi

            if [ -z "$remote_name" ]; then
              echo "::error::Google devolvió un nombre vacío para $local_name."
              exit 1
            fi

            if ! python3 - "$remote_name" <<'PY'
          import re
          import sys

          name = sys.argv[1]
          invalid_chars = '<>:"/\\|?*'
          reserved = {"CON", "PRN", "AUX", "NUL"}
          reserved.update({f"COM{i}" for i in range(1, 10)})
          reserved.update({f"LPT{i}" for i in range(1, 10)})

          ok = True
          if name in {".", ".."} or not name:
              ok = False
          if any(ord(ch) < 32 for ch in name):
              ok = False
          if any(ch in invalid_chars for ch in name):
              ok = False
          if name.endswith(" ") or name.endswith("."):
              ok = False
          stem = name.split(".", 1)[0].upper()
          if stem in reserved:
              ok = False

          raise SystemExit(0 if ok else 1)
          PY
            then
              echo "::error::El nombre de Google '$remote_name' no es válido como carpeta de Windows. No se renombrará nada."
              exit 1
            fi

            if [ "$remote_name" = "$local_name" ]; then
              continue
            fi

            target_dir="natura/apps-script/$remote_name"

            if [ -e "$target_dir" ]; then
              target_script_id=""
              if [ -f "$target_dir/.clasp.json" ]; then
                target_script_id="$(python3 - "$target_dir/.clasp.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              print(json.load(fh).get("scriptId", ""))
          PY
          )"
              fi

              if [ "$target_script_id" = "$script_id" ]; then
                echo "::warning::El mismo scriptId ya existe también en $target_dir. No se hará un renombrado ambiguo."
                continue
              fi

              echo "::error::No se puede renombrar $local_name a $remote_name porque esa carpeta ya existe con otro proyecto."
              exit 1
            fi

            echo "Renombrando carpeta según Google Apps Script: $local_name -> $remote_name"
            git mv "$project_dir" "$target_dir"
          done

      - name: Descargar proyectos registrados
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          while IFS= read -r -d '' config; do
            project_dir="$(dirname "$config")"
            echo "Sincronizando $project_dir"
            (
              cd "$project_dir"
              clasp pull
            )
          done < <(find natura/apps-script -mindepth 2 -maxdepth 2 -type f -name .clasp.json -print0)

      - name: Guardar cambios recibidos desde Google
        run: |
          git add -A natura/apps-script
          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sincronizar Apps Script de Natura desde Google"

          # Si main avanzó mientras se sincronizaba, intenta integrar esos cambios antes de publicar.
          git pull --rebase origin main
          git push origin HEAD:main
