name: Sincronización Google a Git desactivada

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  estado:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar dirección de sincronización
        run: |
          echo "La sincronización automática Google Apps Script -> GitHub está desactivada."
          echo "La dirección activa es GitHub -> Google Apps Script -> implementación."
          echo "Este workflow no lee, modifica ni elimina proyectos de Google."
