name: Verificar anuncios dinamicos Natura

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verificar-anuncios-natura.yml'
      - 'natura/catalogo.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-anuncios:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verificar indice de Drive y HTML publicado
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          def get(url, limit):
              request = urllib.request.Request(
                  url, headers={"User-Agent": "Mozilla/5.0 NaturaAdValidator/1.0"}
              )
              with urllib.request.urlopen(request, timeout=40) as response:
                  if response.status != 200:
                      raise RuntimeError("Respuesta HTTP distinta de 200")
                  content = response.read(limit + 1)
              if len(content) > limit:
                  raise RuntimeError("Respuesta mas grande que el limite")
              return content

          endpoint = "https://script.google.com/macros/s/AKfycbzuHYa9Uf_5v5-FhDXQFu6WRuW49DgxJLUHrm_tq1Vdk539VZjeQeGrlWWqgJj4SzMg2w/exec"
          source = Path("natura/catalogo.html").read_text(encoding="utf-8-sig")
          assert 'id="catalogPromotion"' in source
          assert 'APPS_SCRIPT_IMAGE_SOURCE.endpoint' in source
          assert 'object-fit:contain' in source
          assert 'id="catalogPromotionImage"' in source

          data = json.loads(get(endpoint + "?comprobar_anuncios=1", 8_000_000))
          if data.get("ok") is not True:
              raise RuntimeError("Indice Apps Script invalido")
          folder_id = (data.get("source") or {}).get("adsFolderId")
          if folder_id != "1QitBAhBjw_tik-qacrAmmx7cKMRJhIoM":
              raise RuntimeError("Apps Script no indexa la carpeta anuncios esperada")
          ads = data.get("ads") or {}
          valid = [entry for entry in ads.values() if
                   str(entry.get("mimeType") or "").startswith("image/") and
                   str(entry.get("url") or "").startswith("https://lh3.googleusercontent.com/d/")]
          if not valid:
              raise RuntimeError("La carpeta anuncios no produjo imagenes validas en el indice remoto")
          print("INDICE DE ANUNCIOS: OK; archivos:", len(valid), flush=True)
          print("PRINCIPAL:", valid[0].get("name"), flush=True)

          public = get("https://irenismb.github.io/stock/natura/catalogo.html?verificar-anuncios=1", 2_000_000).decode("utf-8-sig")
          for marker in ('id="catalogPromotion"', 'id="catalogPromotionImage"',
                         'APPS_SCRIPT_IMAGE_SOURCE.endpoint', 'object-fit:contain'):
              if marker not in public:
                  raise RuntimeError("El catalogo publicado no incluye la funcion: " + marker)
          print("PUBLICACION GITHUB PAGES: OK, anuncio dinamico presente.", flush=True)
          print("EXITO: carpeta anuncios de Drive enlazada con la tarjeta del catalogo.", flush=True)
          PY
