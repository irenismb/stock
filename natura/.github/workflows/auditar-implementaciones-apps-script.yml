name: Auditar implementaciones de Google Apps Script

# Solo lectura: este workflow no modifica proyectos ni implementaciones en Google.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/auditar-implementaciones-apps-script.yml"

permissions:
  contents: read

jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar clasp
        run: npm install --global @google/clasp@3.4.1

      - name: Restaurar autorización de Google
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Falta el secreto CLASPRC_JSON"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          chmod 600 "$RUNNER_TEMP/.clasprc.json"

      - name: Consultar implementaciones sin modificar Google
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          clasp list-scripts --json > "$RUNNER_TEMP/scripts.json"

          python3 - "$RUNNER_TEMP/scripts.json" > "$RUNNER_TEMP/scripts.tsv" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              scripts = json.load(fh)
          if not isinstance(scripts, list):
              raise SystemExit("La lista de proyectos de Google no es válida")
          for item in sorted(scripts, key=lambda x: (x.get("name", "").casefold(), x.get("id", ""))):
              script_id = item.get("id", "")
              name = item.get("name", "")
              if script_id and name:
                  print(f"{script_id}\t{name}")
          PY

          echo "=== AUDITORIA_IMPLEMENTACIONES ==="
          while IFS=$'\t' read -r script_id name; do
            [ -n "$script_id" ] || continue
            deployments_file="$RUNNER_TEMP/deployments-$script_id.json"
            clasp deployments "$script_id" --json > "$deployments_file"

            read -r total versioned head_only < <(
              python3 - "$deployments_file" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as fh:
              deployments = json.load(fh)
          if not isinstance(deployments, list):
              raise SystemExit("Respuesta de deployments no válida")
          total = len(deployments)
          versioned = sum(1 for d in deployments if d.get("versionNumber") is not None)
          head_only = sum(1 for d in deployments if d.get("versionNumber") is None)
          print(total, versioned, head_only)
          PY
            )

            printf 'AUDIT\t%s\t%s\t%s\t%s\t%s\n' "$script_id" "$total" "$versioned" "$head_only" "$name"
          done < "$RUNNER_TEMP/scripts.tsv"
          echo "=== FIN_AUDITORIA_IMPLEMENTACIONES ==="
