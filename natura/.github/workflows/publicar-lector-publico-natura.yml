name: Publicar lector publico aislado Natura
on:
  push:
    branches: [main]
    paths:
      - "apps-script/lector publico natura/**"
      - ".github/workflows/publicar-lector-publico-natura.yml"

permissions:
  contents: read

concurrency:
  group: publicar-apps-script-natura-automaticamente
  cancel-in-progress: false

jobs:
  lector:
    if: ${{ vars.NATURA_PUBLICACION_HABILITADA == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Instalar clasp
        run: npm install --global @google/clasp@3.4.1
      - name: Bloquear una publicación que sobrescriba el proyecto administrativo
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path("apps-script")
          def script_id(name):
              with (base / name / ".clasp.json").open(encoding="utf-8") as fh:
                  return json.load(fh).get("scriptId")
          lector_id = script_id("lector publico natura")
          admin_id = script_id("administrar precios natura")
          if not lector_id or not admin_id:
              print("::error::Faltan los identificadores de Apps Script")
              raise SystemExit(1)
          if lector_id == admin_id:
              print("::error::Publicación bloqueada: lector y administrador apuntan al mismo proyecto Apps Script; requiere separar o validar un método seguro sin sobrescritura temporal")
              raise SystemExit(1)
          print("Los proyectos son distintos; continúa la verificación existente")
          PY
      - name: Restaurar autorizacion
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then echo "::error::Falta CLASPRC_JSON"; exit 1; fi
          printf '%s' "$CLASPRC_JSON" > "$RUNNER_TEMP/.clasprc.json"
          chmod 600 "$RUNNER_TEMP/.clasprc.json"
      - name: Comprobar codigo y proyecto
        run: |
          node --check "apps-script/lector publico natura/Lector.js"
          python3 - <<'PY'
          import json
          project = 'apps-script/lector publico natura/'
          conf=json.load(open(project+'.clasp.json'))
          assert conf['scriptId']=='1-wBaemhULEFETfQHJDocPTOjbXnVds27DZfiIU9sMnCYf01qSycs1jc4'
          manifest=json.load(open(project+'appsscript.json'))
          assert manifest['webapp']=={'executeAs':'USER_DEPLOYING','access':'ANYONE_ANONYMOUS'}
          PY
      - name: Publicar version inmutable y restaurar codigo administrativo
        env:
          clasp_config_auth: ${{ runner.temp }}/.clasprc.json
        run: |
          set -euo pipefail
          admin="$GITHUB_WORKSPACE/apps-script/administrar precios natura"
          reader="$GITHUB_WORKSPACE/apps-script/lector publico natura"
          restore_admin() {
            echo "Restaurando codigo fuente de Apps Script administrativo"
            (cd "$admin" && clasp push --force)
          }
          trap restore_admin EXIT
          clasp list-scripts >/dev/null
          if ! (cd "$admin" && clasp deployments) | grep -Fq 'AKfycbwAUk8ysr-3k_T5iRxFpbp8KxmvPpYeGRNbL156lp9CsVjNFjQQgg5v7ySaxO7dcP_X'; then
            echo "::error::No se encuentra el despliegue administrativo esperado."
            exit 1
          fi
          (cd "$reader" && clasp push --force && clasp deploy --deploymentId "AKfycbzotfE1aifLWmjJjyQRTXZo2C9intQnhGZA57n27MCqDDB_BnuhkxhDvDmeuUlK9v09" --description "Lector publico aislado de solo lectura ${GITHUB_SHA}") | tee "$RUNNER_TEMP/lector-deploy.log"
          echo "El lector publico se publico como version independiente."
          echo "DEPLOY DEL LECTOR: verificar la URL en el registro de esta accion." >> "$GITHUB_STEP_SUMMARY"
