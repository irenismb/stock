<!doctype html><html lang="es-CO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cargando catálogo de prueba…</title><style>body{font-family:system-ui;background:#0a0e15;color:#eef2f8;display:grid;place-items:center;min-height:100vh;margin:0}main{text-align:center;padding:24px}.e{color:#fecaca;white-space:pre-wrap}</style></head><body><main id="status">Cargando catálogo de prueba desde GitHub…</main><script>
(async()=>{
  const r=await fetch('catalogo.html',{cache:'no-store'});
  if(!r.ok) throw new Error('No se pudo cargar catalogo.html ('+r.status+').');
  let html=await r.text();
  const replaceBetween=(start,end,value,label)=>{
    const i=html.indexOf(start); const j=i<0?-1:html.indexOf(end,i);
    if(i<0||j<0) throw new Error('No se pudo aplicar el parche: '+label);
    html=html.slice(0,i)+value+html.slice(j);
  };
  replaceBetween("    // Cambia solamente este enlace cuando quieras usar otra carpeta.", "\n\tconst INTERRUPTORES", "    // Fuente de productos: GitHub.\n    // Estructura esperada: natura/Productos/<categoria>/<codigo>_nombre.ext\n    // El TXT y la imagen se emparejan EXCLUSIVAMENTE por el codigo global de cuatro digitos.\n    const GITHUB_CATALOG_SOURCE = {\n      owner: \"irenismb\",\n      repo: \"stock\",\n      branch: \"main\",\n      catalogDir: \"natura\",\n      productsFolder: \"Productos\"\n    };\n", 'configuración GitHub');
  replaceBetween("    const GOOGLE_DOCS_CATALOG_ENDPOINT =", "    function parseOptionalWholeNumber", "    const GITHUB_API_BASE = `https://api.github.com/repos/${GITHUB_CATALOG_SOURCE.owner}/${GITHUB_CATALOG_SOURCE.repo}`;\n    const GITHUB_RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_CATALOG_SOURCE.owner}/${GITHUB_CATALOG_SOURCE.repo}/${encodeURIComponent(GITHUB_CATALOG_SOURCE.branch)}`;\n    const GITHUB_REQUEST_TIMEOUT_MS = 25000;\n    const PRODUCT_IMAGE_EXTENSIONS = new Set([\"jpg\", \"jpeg\", \"png\", \"webp\", \"gif\", \"avif\"]);\n\n    async function fetchGitHubJson(url){\n      const controlador = new AbortController();\n      const temporizador = setTimeout(()=>controlador.abort(), GITHUB_REQUEST_TIMEOUT_MS);\n      try{\n        const respuesta = await fetch(url, {\n          cache: \"no-store\",\n          signal: controlador.signal,\n          headers: { \"Accept\": \"application/vnd.github+json\" }\n        });\n        if(!respuesta.ok){\n          throw new Error(`GitHub respondio ${respuesta.status} al consultar la estructura de Productos.`);\n        }\n        return await respuesta.json();\n      } finally {\n        clearTimeout(temporizador);\n      }\n    }\n\n    function encodeRepoPath(path){\n      return String(path || \"\")\n        .split(\"/\")\n        .filter(Boolean)\n        .map(segmento => encodeURIComponent(segmento))\n        .join(\"/\");\n    }\n\n    function rawGitHubUrl(path){\n      return `${GITHUB_RAW_BASE}/${encodeRepoPath(path)}`;\n    }\n\n    function extractGlobalProductCode(filename){\n      const nombre = String(filename || \"\").trim();\n      const match = nombre.match(/^(\\d{4})(?=$|[_.\\s-])/);\n      return match ? match[1] : \"\";\n    }\n\n    function extensionOfFilename(filename){\n      const nombre = String(filename || \"\");\n      const punto = nombre.lastIndexOf(\".\");\n      return punto >= 0 ? nombre.slice(punto + 1).toLowerCase() : \"\";\n    }\n\n    function categoryFromProductPath(relativePath){\n      const partes = String(relativePath || \"\").split(\"/\").filter(Boolean);\n      return partes.length > 1 ? partes[0] : \"General\";\n    }\n\n    function choosePreferredImage(currentEntry, candidateEntry){\n      if(!currentEntry) return candidateEntry;\n      const ranking = { webp:1, png:2, jpg:3, jpeg:4, avif:5, gif:6 };\n      const actual = ranking[extensionOfFilename(currentEntry.path)] || 99;\n      const candidata = ranking[extensionOfFilename(candidateEntry.path)] || 99;\n      return candidata < actual ? candidateEntry : currentEntry;\n    }\n\n    async function loadGitHubProductFileIndex(){\n      const ref = encodeURIComponent(GITHUB_CATALOG_SOURCE.branch);\n      const catalogDir = encodeRepoPath(GITHUB_CATALOG_SOURCE.catalogDir);\n      const parentUrl = `${GITHUB_API_BASE}/contents/${catalogDir}?ref=${ref}`;\n      const parentEntries = await fetchGitHubJson(parentUrl);\n      if(!Array.isArray(parentEntries)){\n        throw new Error(\"GitHub no devolvio la carpeta del catalogo en el formato esperado.\");\n      }\n\n      const productsEntry = parentEntries.find(entry =>\n        entry && entry.type === \"dir\" &&\n        String(entry.name || \"\").localeCompare(GITHUB_CATALOG_SOURCE.productsFolder, \"es\", { sensitivity:\"accent\" }) === 0\n      ) || parentEntries.find(entry =>\n        entry && entry.type === \"dir\" &&\n        String(entry.name || \"\").toLowerCase() === GITHUB_CATALOG_SOURCE.productsFolder.toLowerCase()\n      );\n\n      if(!productsEntry || !productsEntry.sha){\n        throw new Error(`No existe la carpeta ${GITHUB_CATALOG_SOURCE.catalogDir}/${GITHUB_CATALOG_SOURCE.productsFolder} en GitHub.`);\n      }\n\n      const treeUrl = `${GITHUB_API_BASE}/git/trees/${encodeURIComponent(productsEntry.sha)}?recursive=1`;\n      const treePayload = await fetchGitHubJson(treeUrl);\n      if(!treePayload || !Array.isArray(treePayload.tree)){\n        throw new Error(\"GitHub no devolvio el arbol de Productos en el formato esperado.\");\n      }\n      if(treePayload.truncated){\n        throw new Error(\"La carpeta Productos es demasiado grande para enumerarla de forma segura en una sola consulta.\");\n      }\n\n      const byCode = new Map();\n      for(const entry of treePayload.tree){\n        if(!entry || entry.type !== \"blob\") continue;\n        const relativePath = String(entry.path || \"\");\n        const filename = relativePath.split(\"/\").pop() || \"\";\n        const code = extractGlobalProductCode(filename);\n        if(!code) continue;\n\n        const ext = extensionOfFilename(filename);\n        const record = byCode.get(code) || { code, txt:null, image:null };\n        if(ext === \"txt\"){\n          // El nombre NO participa en el emparejamiento: solo importa el codigo.\n          if(!record.txt) record.txt = entry;\n        }else if(PRODUCT_IMAGE_EXTENSIONS.has(ext)){\n          record.image = choosePreferredImage(record.image, entry);\n        }\n        byCode.set(code, record);\n      }\n\n      return Array.from(byCode.values())\n        .filter(record => record.txt)\n        .sort((a,b)=>a.code.localeCompare(b.code, \"es\", { numeric:true }));\n    }\n\n    async function fetchProductTxt(record){\n      const relativeTxtPath = String(record && record.txt && record.txt.path || \"\");\n      const fullTxtPath = `${GITHUB_CATALOG_SOURCE.catalogDir}/${GITHUB_CATALOG_SOURCE.productsFolder}/${relativeTxtPath}`;\n      const respuesta = await fetch(rawGitHubUrl(fullTxtPath), { cache:\"no-store\" });\n      if(!respuesta.ok){\n        throw new Error(`No se pudo leer el TXT del producto ${record.code}.`);\n      }\n      return await respuesta.text();\n    }\n\n    function splitProductTxt(text){\n      const clean = String(text || \"\")\n        .replace(/^\\uFEFF/, \"\")\n        .replace(/\\r\\n?/g, \"\\n\")\n        .trim();\n      if(!clean) return { name:\"\", body:\"\" };\n\n      const lines = clean.split(\"\\n\");\n      const firstLine = String(lines.shift() || \"\").trim();\n      const name = firstLine.replace(/^\\d{4}\\s*-\\s*/, \"\").trim();\n      const body = lines.join(\"\\n\").trim();\n      return { name, body };\n    }\n\n\n", 'cargador GitHub');
  replaceBetween("    function makeProductFromGoogleDoc(item){", "    function clearLegacyProductCaches", "    async function makeProductFromGitHubFiles(record){\n      const code = String((record && record.code) || \"\").trim();\n      if(!/^\\d{4}$/.test(code) || !record || !record.txt) return null;\n\n      const txtText = await fetchProductTxt(record);\n      const txt = splitProductTxt(txtText);\n      if(!txt.name) return null;\n\n      // Recompone temporalmente el esquema oficial para reutilizar el parser existente.\n      const completeRecord = `${txt.name.replace(/\\s+$/g, \"\").replace(/\\.$/, \"\")}. ${txt.body}`.trim();\n      const parsedRecord = parseOfficialInventoryRecord({\n        name: txt.name,\n        description: completeRecord\n      });\n\n      const txtRelativePath = String(record.txt.path || \"\");\n      const imageRelativePath = String(record.image && record.image.path || \"\");\n      const category = categoryFromProductPath(txtRelativePath || imageRelativePath);\n      const fullTxtPath = `${GITHUB_CATALOG_SOURCE.catalogDir}/${GITHUB_CATALOG_SOURCE.productsFolder}/${txtRelativePath}`;\n      const fullImagePath = imageRelativePath\n        ? `${GITHUB_CATALOG_SOURCE.catalogDir}/${GITHUB_CATALOG_SOURCE.productsFolder}/${imageRelativePath}`\n        : \"\";\n      const docsImageUrl = fullImagePath ? rawGitHubUrl(fullImagePath) : \"\";\n      const imageFilename = imageRelativePath || `${category}/${code}`;\n\n      return {\n        id: code,\n        name: parsedRecord.name || txt.name,\n        category,\n        brand: \"\",\n        price: parsedRecord.price,\n        hasPrice: parsedRecord.hasPrice,\n        stock: parsedRecord.stock,\n        referenceExternal: parsedRecord.referenceExternal,\n        isUnstructured: false,\n        originalFilename: txtRelativePath.split(\"/\").pop() || \"\",\n        srcFilename: imageFilename,\n        imgFilename: imageFilename,\n        fileExt: extensionOfFilename(imageFilename),\n        hasImage: Boolean(docsImageUrl),\n        isDocumentFirst: false,\n        description: parsedRecord.description,\n        docsImageUrl,\n        docsDocumentUrl: rawGitHubUrl(fullTxtPath),\n        searchKey: normalizeText([parsedRecord.name || txt.name, category, parsedRecord.description].filter(Boolean).join(\" \"))\n      };\n    }\n\n\n", 'producto GitHub');
  replaceBetween("        const googleDocsProducts = await loadGoogleDocsCatalogJsonp();", "        updateCatalogFooterProducts(products);", "        const githubRecords = await loadGitHubProductFileIndex();\n        const loadedProducts = await Promise.all(githubRecords.map(makeProductFromGitHubFiles));\n        const products = loadedProducts.filter(Boolean);\n\n        if(!products.length){\n          throw new Error(\"GitHub no devolvio productos validos desde la carpeta Productos.\");\n        }\n\n", 'inicialización GitHub');
  const oldMessage='No se pudieron cargar los productos desde Google Docs. Reintenta más tarde.';
  if(!html.includes(oldMessage)) throw new Error('No se pudo aplicar el parche: mensaje de error');
  html=html.replace(oldMessage,'No se pudieron cargar los productos desde GitHub/Productos. Reintenta más tarde.');
  document.open(); document.write(html); document.close();
})().catch(err=>{console.error(err);document.getElementById('status').innerHTML='<div class="e"><strong>No se pudo cargar la copia de prueba.</strong><br><br>'+String(err.message||err)+'</div>';});
</script></body></html>
