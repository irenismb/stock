<!doctype html>
<!-- Versión: 1 -->
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Activar notificaciones del catálogo</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:24px;line-height:1.5}
    button,input{font:inherit;padding:12px}
    input{width:100%;box-sizing:border-box}
    button{cursor:pointer;margin-top:12px}
    pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f3f3;padding:12px;border-radius:8px}
    .ok{font-weight:700}
  </style>
</head>
<body>
  <h1>Activar notificaciones push</h1>
  <p>Abre esta página únicamente en el celular que debe recibir los avisos de nuevas visitas. La suscripción identifica el dispositivo; no utiliza el número telefónico para entregar el push.</p>

  <label for="vapid">Clave pública VAPID de Firebase (opcional si el navegador acepta la predeterminada)</label>
  <input id="vapid" autocomplete="off" placeholder="Pega aquí la clave pública VAPID si la tienes">

  <button id="activar" type="button">Activar notificaciones</button>
  <button id="copiar" type="button" hidden>Copiar identificador FID</button>

  <p id="estado" aria-live="polite"></p>
  <pre id="fid" hidden></pre>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getMessaging, isSupported, onRegistered, register } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCrC5pmGyX-VaX4f-KI0AU8A6GWP-YDngM",
      authDomain: "mundial-a9de1.firebaseapp.com",
      databaseURL: "https://mundial-a9de1-default-rtdb.firebaseio.com",
      projectId: "mundial-a9de1",
      storageBucket: "mundial-a9de1.firebasestorage.app",
      messagingSenderId: "598028608340",
      appId: "1:598028608340:web:a176c1fbdfcef564419ec1",
      measurementId: "G-YJY5PWKPGJ"
    };

    const estado = document.getElementById("estado");
    const fidEl = document.getElementById("fid");
    const copiar = document.getElementById("copiar");
    const vapid = document.getElementById("vapid");
    const activar = document.getElementById("activar");

    vapid.value = localStorage.getItem("natura_push_vapid_publica") || "";

    activar.addEventListener("click", async () => {
      try {
        estado.textContent = "Preparando el dispositivo…";

        if (!("Notification" in window) || !("serviceWorker" in navigator)) {
          throw new Error("Este navegador no admite notificaciones push web.");
        }
        if (!(await isSupported())) {
          throw new Error("Firebase Cloud Messaging no es compatible con este navegador.");
        }

        const permiso = await Notification.requestPermission();
        if (permiso !== "granted") {
          throw new Error("No se concedió permiso para mostrar notificaciones.");
        }

        const sw = await navigator.serviceWorker.register(
          "./2026-09-05_servicio push firebase notificaciones celular catálogo_v1.js",
          { scope: "./" }
        );

        const app = initializeApp(firebaseConfig);
        const messaging = getMessaging(app);
        const vapidKey = vapid.value.trim();
        if (vapidKey) localStorage.setItem("natura_push_vapid_publica", vapidKey);

        const fid = await new Promise((resolve, reject) => {
          const cancelar = onRegistered(messaging, installationId => {
            cancelar();
            resolve(installationId);
          });
          const opciones = { serviceWorkerRegistration: sw };
          if (vapidKey) opciones.vapidKey = vapidKey;
          register(messaging, opciones).catch(error => {
            cancelar();
            reject(error);
          });
          setTimeout(() => {
            cancelar();
            reject(new Error("Firebase no devolvió el FID del dispositivo."));
          }, 20000);
        });

        fidEl.textContent = fid;
        fidEl.hidden = false;
        copiar.hidden = false;
        copiar.dataset.fid = fid;
        estado.textContent = "Notificaciones activadas en este dispositivo. Copia el FID para configurarlo como destino seguro.";
        estado.className = "ok";
      } catch (error) {
        estado.textContent = error?.message || String(error);
        estado.className = "";
      }
    });

    copiar.addEventListener("click", async () => {
      const fid = copiar.dataset.fid || "";
      if (!fid) return;
      await navigator.clipboard.writeText(fid);
      estado.textContent = "FID copiado.";
    });
  </script>
</body>
</html>
