<!doctype html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Conexión del administrador</title>
  <style>
    :root{color-scheme:light;--ink:#352b2c;--muted:#78696b;--line:#e7dad7;--rose:#8d5360;--soft:#fff7f8;--ok:#176b3a;--error:#a02323}
    *{box-sizing:border-box}
    body{margin:0;background:#f8f3ef;color:var(--ink);font:15px/1.45 Arial,sans-serif}
    main{max-width:520px;margin:0 auto;padding:28px 20px;text-align:center}
    h1{margin:0 0 10px;font-size:24px}
    p{margin:0;color:var(--muted)}
    #estado{padding:16px;border:1px solid var(--line);border-radius:14px;background:#fff}
    #estado.ok{color:var(--ok);border-color:#b8ddcf;background:#eef9f4}
    #estado.error{color:var(--error);border-color:#e6bac3;background:#fff4f6}
  </style>
</head>
<body>
  <main>
    <h1>Administración del catálogo</h1>
    <p id="estado" role="status" aria-live="polite">Verificando la conexión con el catálogo…</p>
  </main>

  <script>
    const estado = document.getElementById("estado");
    const CATALOG_ORIGIN = "https://irenismb.github.io";
    let puerto = null;

    google.script.url.getLocation(function(ubicacion){
      const canal = String(ubicacion && ubicacion.parameter && ubicacion.parameter.canal || "").trim();
      if(!/^[A-Za-z0-9_-]{16,120}$/.test(canal)){
        mostrarError("La solicitud de conexión no es válida.");
        return;
      }

      let destino = null;
      try{
        if(window.top && window.top.opener) destino = window.top.opener;
      }catch(_){}
      if(!destino){
        try{ if(window.opener) destino = window.opener; }catch(_){}
      }
      if(!destino){
        try{ if(window.top && window.top !== window) destino = window.top; }catch(_){}
      }

      if(!destino){
        mostrarError("Abre esta conexión desde el botón Administrar del catálogo.");
        return;
      }

      const canalMensajes = new MessageChannel();
      puerto = canalMensajes.port1;
      puerto.onmessage = procesarSolicitud;
      puerto.start();

      destino.postMessage(
        {tipo:"irenismb-precios-puente-listo", canal:canal, capacidades:["precio","visibilidad","configuracion"]},
        CATALOG_ORIGIN,
        [canalMensajes.port2]
      );

      estado.className = "ok";
      estado.textContent = "Conexión segura activa con el catálogo.";
    });

    function procesarSolicitud(evento){
      const mensaje = evento && evento.data || {};
      if(!mensaje.solicitudId) return;

      if(mensaje.tipo === "actualizar-precio"){
        google.script.run
          .withSuccessHandler(function(resultado){
            responder({tipo:"precio-actualizado", solicitudId:mensaje.solicitudId, resultado:resultado});
          })
          .withFailureHandler(function(error){
            responder({
              tipo:"precio-error",
              solicitudId:mensaje.solicitudId,
              error:error && error.message ? error.message : String(error || "No se pudo guardar el precio.")
            });
          })
          .actualizarPrecioWeb(mensaje.codigo, mensaje.precioNuevo, mensaje.precioAnterior);
        return;
      }

      if(mensaje.tipo === "actualizar-visibilidad"){
        google.script.run
          .withSuccessHandler(function(resultado){
            responder({tipo:"visibilidad-actualizada", solicitudId:mensaje.solicitudId, resultado:resultado});
          })
          .withFailureHandler(function(error){
            responder({
              tipo:"visibilidad-error",
              solicitudId:mensaje.solicitudId,
              error:error && error.message ? error.message : String(error || "No se pudo guardar la visibilidad.")
            });
          })
          .actualizarVisibilidadWeb(
            mensaje.tipoRegla,
            mensaje.identificador,
            Boolean(mensaje.ocultoNuevo),
            mensaje.etiqueta || ""
          );
        return;
      }

      if(mensaje.tipo === "obtener-configuracion"){
        google.script.run
          .withSuccessHandler(function(resultado){
            responder({tipo:"configuracion-obtenida", solicitudId:mensaje.solicitudId, resultado:resultado});
          })
          .withFailureHandler(function(error){
            responder({
              tipo:"configuracion-error",
              solicitudId:mensaje.solicitudId,
              error:error && error.message ? error.message : String(error || "No se pudo leer la configuración.")
            });
          })
          .obtenerConfiguracionWeb();
        return;
      }

      if(mensaje.tipo === "actualizar-configuracion"){
        google.script.run
          .withSuccessHandler(function(resultado){
            responder({tipo:"configuracion-actualizada", solicitudId:mensaje.solicitudId, resultado:resultado});
          })
          .withFailureHandler(function(error){
            responder({
              tipo:"configuracion-error",
              solicitudId:mensaje.solicitudId,
              error:error && error.message ? error.message : String(error || "No se pudo guardar la configuración.")
            });
          })
          .actualizarConfiguracionWeb(mensaje.clave, Boolean(mensaje.activado));
      }
    }

    function responder(mensaje){
      try{
        puerto && puerto.postMessage(mensaje);
      }catch(_){}
    }

    function mostrarError(mensaje){
      estado.className = "error";
      estado.textContent = mensaje;
    }
  </script>
</body>
</html>
