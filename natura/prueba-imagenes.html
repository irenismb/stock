<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>PRUEBA TEMPORAL · Imágenes Google Drive vs GitHub</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;padding:24px;background:#f3f1eb;color:#20242b}
    .loading{max-width:720px;margin:10vh auto;padding:24px;border-radius:16px;background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <strong>Preparando prueba temporal del catálogo…</strong>
    <p>Esta página no modifica el catálogo oficial.</p>
  </div>
  <script>
  (async function(){
    try{
      const response = await fetch('catalogo.html?prueba_fuente=' + Date.now(), { cache:'no-store' });
      if(!response.ok) throw new Error('No se pudo leer catalogo.html: HTTP ' + response.status);
      let html = await response.text();
      const testScript = '<script src="prueba-imagenes-gdrive.js?prueba=2026-09-11"></scr' + 'ipt>';
      const injection = [
        '<base href="https://irenismb.github.io/stock/natura/">',
        '<meta name="robots" content="noindex,nofollow,noarchive">',
        testScript
      ].join('');
      html = html.replace(/<head([^>]*)>/i, '<head$1>' + injection);
      html = html.replace(/<title>[\s\S]*?<\/title>/i, '<title>PRUEBA TEMPORAL · Catálogo imágenes</title>');
      document.open();
      document.write(html);
      document.close();
    }catch(error){
      document.getElementById('loading').innerHTML = '<strong>No se pudo iniciar la prueba.</strong><p>' + String(error && error.message || error) + '</p>';
    }
  })();
  </script>
</body>
</html>
